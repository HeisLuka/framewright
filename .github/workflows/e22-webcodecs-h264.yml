name: E22 WebCodecs H264

on:
  push:
    branches: [video-engine-v0]
    paths:
      - ".agents/skills/framewright/scripts/bench-webcodecs-encode.mjs"
      - ".github/workflows/e22-webcodecs-h264.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --check .agents/skills/framewright/scripts/bench-webcodecs-encode.mjs
      - name: WebCodecs H264 720
        run: |
          mkdir -p artifacts
          node .agents/skills/framewright/scripts/bench-webcodecs-encode.mjs artifacts/e22-720.json 720 120
      - name: WebCodecs H264 1080
        run: node .agents/skills/framewright/scripts/bench-webcodecs-encode.mjs artifacts/e22-1080.json 1080 60
      - name: Summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profiles = ['720','1080'].map((size) => JSON.parse(fs.readFileSync(`artifacts/e22-${size}.json`, 'utf8')));
          const summary = {
            experiment: 'E22-webcodecs-h264-summary',
            profiles: profiles.map((p) => ({
              width: p.width,
              height: p.height,
              supported: p.supported,
              error: p.error || null,
              encodedFramesPerSecond: p.encodedFramesPerSecond || 0,
              encodeMillisecondsPerFrame: p.encodeMillisecondsPerFrame || null,
              outputBytes: p.outputBytes || 0,
              maxEncodeQueueSize: p.maxEncodeQueueSize || 0,
              hypothesis: p.hypothesis,
              support: p.support || null,
            })),
          };
          fs.writeFileSync('artifacts/e22-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: e22-webcodecs-h264
          path: |
            artifacts/e22-720.json
            artifacts/e22-1080.json
            artifacts/e22-summary.json
