name: E25 WebCodecs batch throughput

on:
  push:
    branches: [video-engine-v0]
    paths:
      - ".agents/skills/framewright/scripts/bench-webcodecs-throughput.mjs"
      - ".github/workflows/e25-webcodecs-throughput.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --check .agents/skills/framewright/scripts/bench-webcodecs-throughput.mjs
      - name: Throughput 720
        env:
          ROUNDS: "2"
          CONCURRENCIES: "1,2,4"
          WEBCODECS_BITRATE: "1000000"
        run: |
          mkdir -p artifacts
          node .agents/skills/framewright/scripts/bench-webcodecs-throughput.mjs artifacts/e25-720.json 720 450
      - name: Throughput 1080
        env:
          ROUNDS: "2"
          CONCURRENCIES: "1,2,4"
          WEBCODECS_BITRATE: "2000000"
        run: node .agents/skills/framewright/scripts/bench-webcodecs-throughput.mjs artifacts/e25-1080.json 1080 450
      - name: Summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profiles = ['720','1080'].map((size) => JSON.parse(fs.readFileSync(`artifacts/e25-${size}.json`, 'utf8')));
          const summary = {
            experiment: 'E25-webcodecs-throughput-summary',
            profiles: profiles.map((p) => ({
              width: p.width,
              frames: p.frames,
              bitrate: p.bitrate,
              browserLaunchMilliseconds: p.browserLaunchMilliseconds,
              scenarios: p.scenarios.map(({concurrency,medianWallMilliseconds,medianVideosPerHour,medianAggregateFramesPerSecond,medianPageReadyMilliseconds,medianJobWallMilliseconds,throughputVsConcurrency1}) => ({concurrency,medianWallMilliseconds,medianVideosPerHour,medianAggregateFramesPerSecond,medianPageReadyMilliseconds,medianJobWallMilliseconds,throughputVsConcurrency1})),
              best: p.best,
              warmPool: p.warmPool,
              hypotheses: p.hypotheses,
              caveat: p.caveat,
            })),
          };
          fs.writeFileSync('artifacts/e25-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: e25-webcodecs-throughput
          path: |
            artifacts/e25-720.json
            artifacts/e25-1080.json
            artifacts/e25-summary.json
