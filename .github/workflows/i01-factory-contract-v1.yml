name: I01 Factory Contract v1

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - 'contracts/video-factory-v1.schema.json'
      - 'contracts/factory-identity-v1.mjs'
      - 'contracts/audio-identity-v1.mjs'
      - 'contracts/check-example-v1.mjs'
      - 'contracts/check-i04-duration-audio.mjs'
      - 'contracts/examples/video-factory-v1.example.json'
      - 'docs/video-factory-contract-v1.md'
      - '.github/workflows/i01-factory-contract-v1.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Parse schema and verify canonical identities
        run: node contracts/check-example-v1.mjs
      - name: Verify I04 duration and canonical audio invariants
        run: node contracts/check-i04-duration-audio.mjs
      - name: Syntax check identity helpers
        run: |
          node --check contracts/factory-identity-v1.mjs
          node --check contracts/audio-identity-v1.mjs
