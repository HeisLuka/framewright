name: I02 FAST Backend Scout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/i02-fast-backend-scout.mjs'
      - '.agents/skills/framewright/scripts/i02-stage-summary.mjs'
      - '.agents/skills/framewright/scripts/i02-quality-calibration.mjs'
      - '.agents/skills/framewright/scripts/i02-consistent-quality-target.mjs'
      - '.agents/skills/framewright/scripts/i02-webcodecs-quality-matrix.mjs'
      - '.github/workflows/i02-fast-backend-scout.yml'
      - 'docs/i02-fast-backend-scout.md'
  workflow_dispatch:

jobs:
  same-scene-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @napi-rs/canvas@1.0.9
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/i02-fast-backend-scout.mjs
          node --check .agents/skills/framewright/scripts/i02-stage-summary.mjs
          node --check .agents/skills/framewright/scripts/i02-quality-calibration.mjs
          node --check .agents/skills/framewright/scripts/i02-consistent-quality-target.mjs
          node --check .agents/skills/framewright/scripts/i02-webcodecs-quality-matrix.mjs

      - name: Prepare exact C18 semantic scene + fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-i02.html examples/book-ad-systems/index-e17-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-i02.html examples/book-ad-systems/index-e17-e14-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-i02.html examples/book-ad-systems/index-e18-for-i02.html
          node .agents/skills/framewright/scripts/make-e18-responsive-variant-fixtures.mjs examples/book-ad-systems/generated-i02

      - name: Make deterministic 12s audio fixture
        run: |
          mkdir -p artifacts/i02
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=110:sample_rate=48000:duration=12' -filter:a 'volume=0.06' -c:a pcm_s16le artifacts/i02/track.wav

      - name: Run apples-to-apples scout
        env:
          HTML: examples/book-ad-systems/index-e18-for-i02.html
          MANIFEST: examples/book-ad-systems/generated-i02/manifest.json
          OUT_DIR: artifacts/i02
          REPORT: artifacts/i02/report.json
          SUMMARY: artifacts/i02/summary.md
          TRACK: artifacts/i02/track.wav
          BOOK_ID: river-station
          VARIANT: hook-first
          PROFILE: vertical
          REPEATS: '3'
          BITRATE: '2000000'
          X264_PRESET: veryfast
          X264_CRF: '22'
          WEBCODECS_QUEUE: '8'
        run: node --input-type=module -e "globalThis.window={RISO:{fps:30}}; await import('./.agents/skills/framewright/scripts/i02-fast-backend-scout.mjs')"

      - name: Analyze stage budget
        env:
          OUT_DIR: artifacts/i02
          REPORT: artifacts/i02/report.json
        run: node .agents/skills/framewright/scripts/i02-stage-summary.mjs

      - name: Measure legacy four-frame codec sample
        env:
          OUT_DIR: artifacts/i02
        run: node .agents/skills/framewright/scripts/i02-quality-calibration.mjs

      - name: Recalibrate quality on identical semantic frames
        env:
          HTML: examples/book-ad-systems/index-e18-for-i02.html
          MANIFEST: examples/book-ad-systems/generated-i02/manifest.json
          OUT_DIR: artifacts/i02
          BOOK_ID: river-station
          VARIANT: hook-first
          PROFILE: vertical
        run: node .agents/skills/framewright/scripts/i02-consistent-quality-target.mjs

      - name: Sweep WebCodecs bitrate and scene keyframes
        env:
          HTML: examples/book-ad-systems/index-e18-for-i02.html
          MANIFEST: examples/book-ad-systems/generated-i02/manifest.json
          OUT_DIR: artifacts/i02
          BOOK_ID: river-station
          VARIANT: hook-first
          PROFILE: vertical
          MATRIX_BITRATES: '1500000,2000000,2500000,3000000,4000000'
          MATRIX_KEYFRAMES: 'fixed2s,scene+2s'
          WEBCODECS_QUEUE: '8'
        run: node .agents/skills/framewright/scripts/i02-webcodecs-quality-matrix.mjs

      - name: Show scout summaries
        if: always()
        run: |
          for f in artifacts/i02/summary.md artifacts/i02/stage-summary.md artifacts/i02/quality-calibration.md artifacts/i02/webcodecs-quality-matrix.md; do
            test -f "$f" && { echo; cat "$f"; } || true
          done
          test -f artifacts/i02/report.json && node -e "const r=require('./artifacts/i02/report.json'); console.log(JSON.stringify(r.summary,null,2));" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i02-fast-backend-scout
          path: artifacts/i02/
          retention-days: 14
