name: I02 Native Buffer Cadence

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/i02-native-buffer-cadence-probe.mjs'
      - '.github/workflows/i02-native-buffer-cadence.yml'
  workflow_dispatch:

jobs:
  cadence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @napi-rs/canvas@1.0.9 @napi-rs/webcodecs@1.3.0
      - name: Prepare exact C18 scene
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-i02.html examples/book-ad-systems/index-e17-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-i02.html examples/book-ad-systems/index-e17-e14-for-i02.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-i02.html examples/book-ad-systems/index-e18-for-i02.html
          node .agents/skills/framewright/scripts/make-e18-responsive-variant-fixtures.mjs examples/book-ad-systems/generated-i02
      - name: Run cadence matrix
        env:
          HTML: examples/book-ad-systems/index-e18-for-i02.html
          MANIFEST: examples/book-ad-systems/generated-i02/manifest.json
          BOOK_ID: river-station
          VARIANT: hook-first
          PROFILE: vertical
          BITRATE: '2000000'
          QUEUE: '8'
        run: |
          mkdir -p artifacts/i02-cadence
          for n in 1 2 4 8 16; do
            echo "=== cadence $n ==="
            OUT_DIR=artifacts/i02-cadence YIELD_EVERY="$n" node .agents/skills/framewright/scripts/i02-native-buffer-cadence-probe.mjs
          done
      - name: Summarize
        run: |
          node - <<'NODE'
          const fs=require('fs');
          console.log('cadence\twall_s\tvideos_h\tCPU_s\tpeak_RSS_MiB\tqueue\tyields\tdraw_ms\textract_ms\tyield_ms');
          for (const n of [1,2,4,8,16]) {
            const r=JSON.parse(fs.readFileSync(`artifacts/i02-cadence/cadence-${n}.json`));
            console.log(`${n}\t${(r.wallMs/1000).toFixed(3)}\t${r.videosPerHour}\t${(r.cpuMs/1000).toFixed(3)}\t${r.peakRssMiB}\t${r.maxQueue}\t${r.yieldCount}\t${r.drawMs.mean}\t${r.extractMs.mean}\t${r.yieldMs.mean}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: i02-native-buffer-cadence
          path: artifacts/i02-cadence/
          retention-days: 14
