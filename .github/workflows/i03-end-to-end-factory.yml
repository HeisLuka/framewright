name: I03 End-to-End Video Factory

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/make-i03-campaign-fixture.mjs'
      - '.agents/skills/framewright/scripts/i03-end-to-end-factory.mjs'
      - '.agents/skills/framewright/scripts/run-video-factory.mjs'
      - '.agents/skills/framewright/scripts/render-factory-fast.mjs'
      - '.agents/skills/framewright/scripts/render-webcodecs.mjs'
      - 'contracts/make-i03-factory-fixture.mjs'
      - 'contracts/c19-delivery-package-v1.mjs'
      - 'contracts/check-c19-delivery-package.mjs'
      - 'contracts/runtime-consumer-v1.mjs'
      - 'contracts/factory-identity-v1.mjs'
      - 'contracts/audio-identity-v1.mjs'
      - '.github/workflows/i03-end-to-end-factory.yml'
      - 'docs/i03-end-to-end-factory.md'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Syntax and contract checks
        run: |
          node --check .agents/skills/framewright/scripts/make-i03-campaign-fixture.mjs
          node --check .agents/skills/framewright/scripts/i03-end-to-end-factory.mjs
          node --check .agents/skills/framewright/scripts/run-video-factory.mjs
          node --check .agents/skills/framewright/scripts/render-factory-fast.mjs
          node contracts/check-c19-delivery-package.mjs
          node contracts/check-example-v1.mjs
          node contracts/check-i04-duration-audio.mjs
      - name: Generate verified C27 source pack
        run: |
          mkdir -p .bench/i03
          node .agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs .bench/i03/c27-fixtures
      - name: Build current C26 to C27 runtime template
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-i03.html
          node .agents/skills/framewright/scripts/prepare-c22-motion-quality.mjs examples/book-ad-systems/index-e12-i03.html examples/book-ad-systems/index-c22-i03.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-c22-i03.html examples/book-ad-systems/index-e17-i03.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-i03.html examples/book-ad-systems/index-e17-e14-i03.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-i03.html examples/book-ad-systems/index-e18-i03.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-i03.html examples/book-ad-systems/index-c20-i03.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-i03.html examples/book-ad-systems/index-c21-i03.html
          node .agents/skills/framewright/scripts/prepare-c23-cover-composition.mjs examples/book-ad-systems/index-c21-i03.html examples/book-ad-systems/index-c23-i03.html
          node .agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs examples/book-ad-systems/index-c23-i03.html examples/book-ad-systems/index-c24-i03.html
          node .agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs examples/book-ad-systems/index-c24-i03.html examples/book-ad-systems/index-c25-i03.html
          node .agents/skills/framewright/scripts/prepare-c26-platform-safe.mjs examples/book-ad-systems/index-c25-i03.html examples/book-ad-systems/index-c26-i03.html examples/book-ad-systems/platform-ui-profiles.v1.json
          node .agents/skills/framewright/scripts/prepare-c27-narrative-template.mjs examples/book-ad-systems/index-c26-i03.html examples/book-ad-systems/index-c27-i03.html
      - name: Build canonical 9s AAC artifact
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=220:sample_rate=48000' -t 9 -c:a pcm_s16le .bench/i03/source.wav
          ffmpeg -hide_banner -loglevel error -y -i .bench/i03/source.wav -t 9 -c:a aac -b:a 192k -movflags +faststart .bench/i03/canonical-audio.m4a
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json .bench/i03/canonical-audio.m4a
      - name: Compile bounded C27 campaign fixture
        run: |
          node .agents/skills/framewright/scripts/make-i03-campaign-fixture.mjs \
            .bench/i03/c27-fixtures \
            examples/book-ad-systems/index-c27-i03.html \
            .bench/i03/source.wav \
            .bench/i03/canonical-audio.m4a \
            .bench/i03/input
      - name: Execute campaign through C19 package and shared FAST runtime
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/i03-end-to-end-factory.mjs \
            --campaign .bench/i03/input/campaign.json \
            --execution-map .bench/i03/input/execution-map.json \
            --out-dir .bench/i03/run
      - name: Validate campaign manifest, receipts, cache and media
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const dir='.bench/i03/run';
          const m=JSON.parse(fs.readFileSync(path.join(dir,'campaign-manifest.json'),'utf8'));
          assert.equal(m.schema,'newboo-i03-campaign-run-v1');
          assert.equal(m.qa.status,'pass');
          assert.deepEqual(m.counts,{selected_creatives:1,render_specs:2,reserves:1,artifacts:2});
          assert.equal(new Set(m.renders.map(x=>x.render_spec_id)).size,2);
          assert.equal(new Set(m.renders.map(x=>x.platform_ui_profile)).size,2);
          assert.equal(new Set(m.renders.map(x=>x.scene_payload_sha256)).size,2);
          assert.equal(new Set(m.renders.map(x=>x.artifact.sha256)).size,2);
          assert.equal(new Set(m.renders.map(x=>x.audio_spec_id)).size,1);
          assert.ok(m.renders.every(x=>x.first_cache_hit===false));
          assert.ok(m.renders.every(x=>x.replay_cache_hit===true));
          assert.ok(m.renders.every(x=>x.qa.status==='pass'));
          for(const r of m.renders){
            const mp4=path.join(dir,r.artifact.storage_uri);
            assert.ok(fs.existsSync(mp4),`${mp4} missing`);
            const first=JSON.parse(fs.readFileSync(path.join(dir,`${r.render_spec_id}.first.json`),'utf8'));
            const second=JSON.parse(fs.readFileSync(path.join(dir,`${r.render_spec_id}.second.json`),'utf8'));
            assert.deepEqual(Object.keys(first.invocation).sort(),['attempts','cache_hit']);
            assert.equal(first.invocation.cache_hit,false);
            assert.equal(second.invocation.cache_hit,true);
            assert.equal(first.output.sha256,second.output.sha256);
            const profile=first.qa.checks.find(x=>x.id==='delivery-platform-profile');
            assert.equal(profile.status,'pass');
            assert.equal(profile.details.bound,r.platform_ui_profile);
            const audio=first.qa.checks.find(x=>x.id==='audio-stream');
            assert.equal(audio.details.present,true);
            assert.equal(audio.details.audio_spec_id,r.audio_spec_id);
            const p=spawnSync('ffprobe',['-v','error','-count_frames','-show_entries','format=duration:stream=codec_type,codec_name,nb_read_frames','-of','json',mp4],{encoding:'utf8'});
            assert.equal(p.status,0,p.stderr);
            const media=JSON.parse(p.stdout),v=media.streams.find(x=>x.codec_type==='video'),a=media.streams.find(x=>x.codec_type==='audio');
            assert.equal(Number(v.nb_read_frames),270);
            assert.equal(a.codec_name,'aac');
            assert.ok(Math.abs(Number(media.format.duration)-9)<=0.04,`duration ${media.format.duration}`);
          }
          console.log(JSON.stringify({campaign:m.campaign_id,counts:m.counts,renderSpecIds:m.renders.map(x=>x.render_spec_id),platformProfiles:m.renders.map(x=>x.platform_ui_profile),artifactSha256:m.renders.map(x=>x.artifact.sha256),audioSpecId:m.renders[0].audio_spec_id,cacheReplay:m.renders.map(x=>x.replay_cache_hit)},null,2));
          NODE
      - name: Show compact manifest
        if: always()
        run: |
          test -f .bench/i03/run/campaign-manifest.json && node -e "const m=require('./.bench/i03/run/campaign-manifest.json'); console.log(JSON.stringify({campaign:m.campaign_id,counts:m.counts,qa:m.qa,renders:m.renders.map(x=>({profile:x.platform_ui_profile,renderSpecId:x.render_spec_id,sha:x.artifact.sha256,audioSpecId:x.audio_spec_id,cache:x.replay_cache_hit}))},null,2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i03-end-to-end-factory
          path: .bench/i03/
          retention-days: 14
