name: I09 C35 Physical Factory v2

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - 'contracts/i09-normalize-c19-request.mjs'
      - 'contracts/i09-c19-preflight.mjs'
      - 'contracts/check-i09-c35-physical-factory.mjs'
      - '.agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs'
      - '.github/workflows/i09-c35-physical-factory-v2.yml'
  workflow_dispatch:

jobs:
  physical-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install physical renderer dependencies
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check I09 tools
        run: |
          node --check .agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs
          node --check contracts/i09-normalize-c19-request.mjs
          node --check contracts/i09-c19-preflight.mjs
          node --check contracts/check-i09-c35-physical-factory.mjs
      - name: Prepare canonical settled C27 physical fixture
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c22-motion-quality.mjs examples/book-ad-systems/index-e12-for-i09.html examples/book-ad-systems/index-c22-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-c22-for-i09.html examples/book-ad-systems/index-e17-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-i09.html examples/book-ad-systems/index-e17-e14-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-i09.html examples/book-ad-systems/index-e18-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-for-i09.html examples/book-ad-systems/index-c20-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-for-i09.html examples/book-ad-systems/index-c21-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c23-cover-composition.mjs examples/book-ad-systems/index-c21-for-i09.html examples/book-ad-systems/index-c23-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs examples/book-ad-systems/index-c23-for-i09.html examples/book-ad-systems/index-c24-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs examples/book-ad-systems/index-c24-for-i09.html examples/book-ad-systems/index-c25-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c26-platform-safe.mjs examples/book-ad-systems/index-c25-for-i09.html examples/book-ad-systems/index-c26-for-i09.html examples/book-ad-systems/platform-ui-profiles.v1.json
          node .agents/skills/framewright/scripts/prepare-c27-narrative-template.mjs examples/book-ad-systems/index-c26-for-i09.html examples/book-ad-systems/index-c27-i09.html
          node .agents/skills/framewright/scripts/make-c26-platform-safe-fixtures.mjs examples/book-ad-systems/generated-c26
      - name: Build raw C35 physical request
        run: |
          mkdir -p artifacts/i09/input
          node .agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs \
            examples/book-ad-systems/index-c27-i09.html \
            examples/book-ad-systems/generated-c26/payload-paper-short-youtube_shorts.json \
            artifacts/i09/input
          cp artifacts/i09/input/request.json artifacts/i09/input/request.raw.json
      - name: Generate canonical I03 request shape
        run: node contracts/make-i03-factory-fixture.mjs artifacts/i09/input/i03-template-request.json
      - name: Normalize I09 request through canonical C19 shape
        run: |
          node contracts/i09-normalize-c19-request.mjs \
            artifacts/i09/input/request.json \
            artifacts/i09/input/i03-template-request.json \
            artifacts/i09/input/request.json
      - name: C19 direct preflight must pass before queue
        run: node contracts/i09-c19-preflight.mjs artifacts/i09/input/request.json artifacts/i09/c19-preflight.json
      - name: Enqueue once through I07
        run: |
          mkdir -p artifacts/i09
          node .agents/skills/framewright/scripts/enqueue-local-render-job.mjs \
            --queue artifacts/i09/queue \
            --request artifacts/i09/input/request.json \
            --workspace . | tee artifacts/i09/enqueue.json
      - name: Execute one physical I07 job
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/local-render-worker.mjs \
            --queue artifacts/i09/queue \
            --workspace . \
            --once | tee artifacts/i09/worker.json
      - name: Require internal I07 success
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/i09/worker.json','utf8'));
          if(r?.result?.status!=='succeeded') throw new Error(`I07 internal result=${JSON.stringify(r?.result||r)}`);
          NODE
      - name: Re-enqueue identical request after success
        run: |
          node .agents/skills/framewright/scripts/enqueue-local-render-job.mjs \
            --queue artifacts/i09/queue \
            --request artifacts/i09/input/request.json \
            --workspace . | tee artifacts/i09/replay-enqueue.json
      - name: Audit physical C35 -> C19 -> I07 -> MP4 lineage
        run: node contracts/check-i09-c35-physical-factory.mjs artifacts/i09
      - name: Show result or failed queue state
        if: always()
        run: |
          test -f artifacts/i09/summary.md && cat artifacts/i09/summary.md || true
          test -f artifacts/i09/report.json && cat artifacts/i09/report.json || true
          find artifacts/i09/queue/failed -maxdepth 4 -type f -print -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i09-c35-physical-factory-v2
          include-hidden-files: true
          path: |
            artifacts/i09/input/**
            artifacts/i09/c19-preflight.json
            artifacts/i09/enqueue.json
            artifacts/i09/worker.json
            artifacts/i09/replay-enqueue.json
            artifacts/i09/report.json
            artifacts/i09/summary.md
            artifacts/i09/queue/**
          retention-days: 14
