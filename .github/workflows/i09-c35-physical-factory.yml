name: I09 C35 Physical Factory

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - 'contracts/creative-ingress-v1.mjs'
      - 'contracts/compile-composed-creative-proposal-v1.mjs'
      - 'contracts/external-creative-draft-v1.mjs'
      - 'contracts/c19-delivery-package-v1.mjs'
      - 'contracts/check-i09-c35-physical-factory.mjs'
      - '.agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs'
      - '.agents/skills/framewright/scripts/local-render-worker.mjs'
      - '.agents/skills/framewright/scripts/enqueue-local-render-job.mjs'
      - '.agents/skills/framewright/scripts/run-video-factory.mjs'
      - '.agents/skills/framewright/scripts/render-factory-fast.mjs'
      - '.agents/skills/framewright/scripts/c27-narrative-plan.mjs'
      - '.agents/skills/framewright/scripts/prepare-c27-narrative-template.mjs'
      - '.agents/skills/framewright/scripts/prepare-c26-platform-safe-template.mjs'
      - '.agents/skills/framewright/scripts/make-c26-platform-safe-fixtures.mjs'
      - 'examples/book-ad-systems/**'
      - '.github/workflows/i09-c35-physical-factory.yml'
      - 'docs/i09-c35-physical-factory.md'
  workflow_dispatch:

jobs:
  physical-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install physical renderer dependencies
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check integration tools
        run: |
          node --check .agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs
          node --check contracts/check-i09-c35-physical-factory.mjs
          node --check .agents/skills/framewright/scripts/local-render-worker.mjs
      - name: Prepare canonical C27 physical template and real cover fixture
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-i09.html examples/book-ad-systems/index-e17-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-i09.html examples/book-ad-systems/index-e17-e14-for-i09.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-i09.html examples/book-ad-systems/index-e18-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c26-platform-safe-template.mjs examples/book-ad-systems/index-e18-for-i09.html examples/book-ad-systems/index-c26-for-i09.html
          node .agents/skills/framewright/scripts/prepare-c27-narrative-template.mjs examples/book-ad-systems/index-c26-for-i09.html examples/book-ad-systems/index-c27-i09.html
          node .agents/skills/framewright/scripts/make-c26-platform-safe-fixtures.mjs examples/book-ad-systems/generated-c26
      - name: Build three C35 physical scene payloads and canonical campaign request
        run: |
          node .agents/skills/framewright/scripts/i09-build-c35-physical-fixture.mjs \
            examples/book-ad-systems/index-c27-i09.html \
            examples/book-ad-systems/generated-c26/payload-paper-short-youtube_shorts.json \
            artifacts/i09/input | tee artifacts-i09-input.log
      - name: Enqueue once through I07
        run: |
          mkdir -p artifacts/i09
          node .agents/skills/framewright/scripts/enqueue-local-render-job.mjs \
            --queue artifacts/i09/queue \
            --request artifacts/i09/input/request.json \
            --workspace . | tee artifacts/i09/enqueue.json
      - name: Execute one physical I07 job
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/local-render-worker.mjs \
            --queue artifacts/i09/queue \
            --workspace . \
            --once | tee artifacts/i09/worker.json
      - name: Re-enqueue identical request after success
        run: |
          node .agents/skills/framewright/scripts/enqueue-local-render-job.mjs \
            --queue artifacts/i09/queue \
            --request artifacts/i09/input/request.json \
            --workspace . | tee artifacts/i09/replay-enqueue.json
      - name: Audit physical C35 -> C19 -> I07 -> MP4 lineage
        run: node contracts/check-i09-c35-physical-factory.mjs artifacts/i09
      - name: Show result
        if: always()
        run: |
          test -f artifacts/i09/summary.md && cat artifacts/i09/summary.md || true
          test -f artifacts/i09/report.json && cat artifacts/i09/report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i09-c35-physical-factory
          path: |
            artifacts/i09/input/input-report.json
            artifacts/i09/input/publish-ready.json
            artifacts/i09/input/request.json
            artifacts/i09/enqueue.json
            artifacts/i09/worker.json
            artifacts/i09/replay-enqueue.json
            artifacts/i09/report.json
            artifacts/i09/summary.md
            artifacts/i09/queue/results/**/delivery-package.json
            artifacts/i09/queue/results/**/run.json
            artifacts/i09/queue/results/**/canonical-artifacts.json
            artifacts/i09/queue/results/**/receipts/*.json
            artifacts/i09/queue/results/**/video/*.mp4
            artifacts/i09/queue/done/**/attempts/*.json
          retention-days: 14
