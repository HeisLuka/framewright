name: I22 C40 Asset Affine Inversion

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/make-i22-motion-ofat-fixture.mjs'
      - '.agents/skills/framewright/scripts/i22-observe-asset-motion.mjs'
      - '.agents/skills/framewright/scripts/i22-motion-benchmark.mjs'
      - '.agents/skills/framewright/scripts/i22-infer-semantic-observation.mjs'
      - 'contracts/inverse-observation-fusion-v1.mjs'
      - 'examples/book-ad-systems/index-c45-template-variant.html'
      - '.github/workflows/i22-c40-asset-affine.yml'
  workflow_dispatch:

jobs:
  motion-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg and pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax and C51 contract gate
        run: |
          node --check .agents/skills/framewright/scripts/make-i22-motion-ofat-fixture.mjs
          node --check .agents/skills/framewright/scripts/i22-observe-asset-motion.mjs
          node --check .agents/skills/framewright/scripts/i22-motion-benchmark.mjs
          node contracts/check-c51-inverse-observation-fusion.mjs
      - name: Generate canonical C27 source pack
        run: |
          mkdir -p .bench/i22-motion
          node .agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs .bench/i22-motion/c27-fixtures
      - name: Build canonical 9s AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=220:sample_rate=48000' -t 9 -c:a pcm_s16le .bench/i22-motion/source.wav
          ffmpeg -hide_banner -loglevel error -y -i .bench/i22-motion/source.wav -t 9 -c:a aac -b:a 192k -movflags +faststart .bench/i22-motion/canonical-audio.m4a
      - name: Build six-motion physical source corpus
        run: |
          node .agents/skills/framewright/scripts/make-i22-motion-ofat-fixture.mjs \
            .bench/i22-motion/c27-fixtures \
            examples/book-ad-systems/index-c45-template-variant.html \
            .bench/i22-motion/source.wav \
            .bench/i22-motion/canonical-audio.m4a \
            .bench/i22-motion/input
      - name: Render motion corpus through canonical FAST factory
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/run-video-factory.mjs \
            --request .bench/i22-motion/input/campaign.json \
            --out-dir .bench/i22-motion/source-run \
            --artifact-dir .bench/i22-motion/source-artifacts
      - name: Sealed MP4-only cover affine observation and C51 fit
        run: |
          node .agents/skills/framewright/scripts/i22-motion-benchmark.mjs \
            --video-dir .bench/i22-motion/source-run/video \
            --input-dir .bench/i22-motion/input \
            --canonical-artifacts .bench/i22-motion/source-run/canonical-artifacts.json \
            --work-dir .bench/i22-motion/inverse \
            --out .bench/i22-motion/motion-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i22-c40-asset-affine-inversion
          path: |
            .bench/i22-motion/input/
            .bench/i22-motion/source-run/canonical-artifacts.json
            .bench/i22-motion/source-run/run.json
            .bench/i22-motion/source-run/video/
            .bench/i22-motion/inverse/
            .bench/i22-motion/motion-benchmark.json
          retention-days: 14
