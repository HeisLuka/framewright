name: I24 C51 Motion Cover Holdout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/make-i24-motion-cover-holdout.mjs'
      - '.agents/skills/framewright/scripts/i24-motion-cover-benchmark.mjs'
      - '.agents/skills/framewright/scripts/i23-observe-motion.mjs'
      - '.agents/skills/framewright/scripts/i22-infer-semantic-observation.mjs'
      - 'contracts/inverse-observation-fusion-v1.mjs'
      - 'contracts/motion-grammar-families-v2.json'
      - 'examples/book-ad-systems/index-c45-template-variant.html'
      - '.github/workflows/i24-c51-motion-cover-holdout.yml'
  workflow_dispatch:

jobs:
  motion-cover-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg and pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax and inherited contract gates
        run: |
          node --check .agents/skills/framewright/scripts/make-i24-motion-cover-holdout.mjs
          node --check .agents/skills/framewright/scripts/i24-motion-cover-benchmark.mjs
          node --check .agents/skills/framewright/scripts/i23-observe-motion.mjs
          node --check .agents/skills/framewright/scripts/i22-infer-semantic-observation.mjs
          node contracts/check-c51-inverse-observation-fusion.mjs
      - name: Generate canonical six-book C27 source pack
        run: |
          mkdir -p .bench/i24
          node .agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs .bench/i24/c27-fixtures
      - name: Build canonical 9s AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=220:sample_rate=48000' -t 9 -c:a pcm_s16le .bench/i24/source.wav
          ffmpeg -hide_banner -loglevel error -y -i .bench/i24/source.wav -t 9 -c:a aac -b:a 192k -movflags +faststart .bench/i24/canonical-audio.m4a
      - name: Build 36-video book-cover x C40 holdout corpus
        run: |
          node .agents/skills/framewright/scripts/make-i24-motion-cover-holdout.mjs \
            .bench/i24/c27-fixtures \
            examples/book-ad-systems/index-c45-template-variant.html \
            .bench/i24/source.wav \
            .bench/i24/canonical-audio.m4a \
            .bench/i24/source-input
      - name: Render holdout corpus through canonical FAST factory
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/run-video-factory.mjs \
            --request .bench/i24/source-input/campaign.json \
            --out-dir .bench/i24/source-run \
            --artifact-dir .bench/i24/source-artifacts
      - name: Sealed 36-video MP4-only holdout inversion
        run: |
          node .agents/skills/framewright/scripts/i24-motion-cover-benchmark.mjs \
            --video-dir .bench/i24/source-run/video \
            --input-dir .bench/i24/source-input \
            --canonical-artifacts .bench/i24/source-run/canonical-artifacts.json \
            --work-dir .bench/i24/inverse \
            --out .bench/i24/motion-cover-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i24-c51-motion-cover-holdout
          path: |
            .bench/i24/source-input/materialization-manifest.json
            .bench/i24/source-run/canonical-artifacts.json
            .bench/i24/source-run/run.json
            .bench/i24/inverse/
            .bench/i24/motion-cover-benchmark.json
          retention-days: 14
