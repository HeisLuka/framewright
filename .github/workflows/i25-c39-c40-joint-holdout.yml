name: I25 C39 x C40 Joint Holdout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/make-i25-layout-motion-holdout.mjs'
      - '.agents/skills/framewright/scripts/i25-layout-motion-benchmark.mjs'
      - '.agents/skills/framewright/scripts/i25-observe-motion-layout-neutral.mjs'
      - '.agents/skills/framewright/scripts/i22-infer-semantic-observation.mjs'
      - 'contracts/inverse-observation-fusion-v1.mjs'
      - 'examples/book-ad-systems/index-c45-template-variant.html'
      - '.github/workflows/i25-c39-c40-joint-holdout.yml'
  workflow_dispatch:

jobs:
  layout-motion-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg and pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax and inherited inverse gates
        run: |
          node --check .agents/skills/framewright/scripts/make-i25-layout-motion-holdout.mjs
          node --check .agents/skills/framewright/scripts/i25-layout-motion-benchmark.mjs
          node --check .agents/skills/framewright/scripts/i25-observe-motion-layout-neutral.mjs
          node --check .agents/skills/framewright/scripts/i22-infer-semantic-observation.mjs
          node contracts/check-c51-inverse-observation-fusion.mjs
      - name: Generate canonical C27 source pack
        run: |
          mkdir -p .bench/i25
          node .agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs .bench/i25/c27-fixtures
      - name: Build canonical 9s AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=220:sample_rate=48000' -t 9 -c:a pcm_s16le .bench/i25/source.wav
          ffmpeg -hide_banner -loglevel error -y -i .bench/i25/source.wav -t 9 -c:a aac -b:a 192k -movflags +faststart .bench/i25/canonical-audio.m4a
      - name: Build 36-video C39 x C40 holdout corpus
        run: |
          node .agents/skills/framewright/scripts/make-i25-layout-motion-holdout.mjs \
            .bench/i25/c27-fixtures \
            examples/book-ad-systems/index-c45-template-variant.html \
            .bench/i25/source.wav \
            .bench/i25/canonical-audio.m4a \
            .bench/i25/source-input
      - name: Render holdout corpus through canonical FAST factory
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/run-video-factory.mjs \
            --request .bench/i25/source-input/campaign.json \
            --out-dir .bench/i25/source-run \
            --artifact-dir .bench/i25/source-artifacts
      - name: Sealed 36-video MP4-only joint holdout inversion
        run: |
          node .agents/skills/framewright/scripts/i25-layout-motion-benchmark.mjs \
            --video-dir .bench/i25/source-run/video \
            --input-dir .bench/i25/source-input \
            --canonical-artifacts .bench/i25/source-run/canonical-artifacts.json \
            --work-dir .bench/i25/inverse \
            --out .bench/i25/layout-motion-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i25-c39-c40-joint-holdout
          path: |
            .bench/i25/source-input/materialization-manifest.json
            .bench/i25/source-run/canonical-artifacts.json
            .bench/i25/source-run/run.json
            .bench/i25/inverse/
            .bench/i25/layout-motion-benchmark.json
          retention-days: 14
