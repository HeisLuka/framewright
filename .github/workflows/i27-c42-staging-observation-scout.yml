name: I27 C42 Staging Observation Scout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/make-i27-staging-holdout.mjs'
      - '.agents/skills/framewright/scripts/i27-observe-staging-geometry.mjs'
      - '.agents/skills/framewright/scripts/i27-staging-benchmark.mjs'
      - 'contracts/cover-asset-staging-families-v2.mjs'
      - 'examples/book-ad-systems/index-c45-template-variant.html'
      - '.github/workflows/i27-c42-staging-observation-scout.yml'
  workflow_dispatch:

jobs:
  staging-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install ffmpeg and pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax gate
        run: |
          node --check .agents/skills/framewright/scripts/make-i27-staging-holdout.mjs
          node --check .agents/skills/framewright/scripts/i27-observe-staging-geometry.mjs
          node --check .agents/skills/framewright/scripts/i27-staging-benchmark.mjs
      - name: Generate canonical C27 source pack
        run: |
          mkdir -p .bench/i27
          node .agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs .bench/i27/c27-fixtures
      - name: Build canonical 9s AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=220:sample_rate=48000' -t 9 -c:a pcm_s16le .bench/i27/source.wav
          ffmpeg -hide_banner -loglevel error -y -i .bench/i27/source.wav -t 9 -c:a aac -b:a 192k -movflags +faststart .bench/i27/canonical-audio.m4a
      - name: Build 36-video book x C42 staging corpus
        run: |
          node .agents/skills/framewright/scripts/make-i27-staging-holdout.mjs \
            .bench/i27/c27-fixtures \
            examples/book-ad-systems/index-c45-template-variant.html \
            .bench/i27/source.wav \
            .bench/i27/canonical-audio.m4a \
            .bench/i27/source-input
      - name: Render corpus through canonical FAST factory
        env:
          CI: '1'
        run: |
          node .agents/skills/framewright/scripts/run-video-factory.mjs \
            --request .bench/i27/source-input/campaign.json \
            --out-dir .bench/i27/source-run \
            --artifact-dir .bench/i27/source-artifacts
      - name: Sealed MP4-only staging geometry observations
        run: |
          node .agents/skills/framewright/scripts/i27-staging-benchmark.mjs \
            --video-dir .bench/i27/source-run/video \
            --input-dir .bench/i27/source-input \
            --canonical-artifacts .bench/i27/source-run/canonical-artifacts.json \
            --work-dir .bench/i27/inverse \
            --out .bench/i27/staging-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i27-c42-staging-observation-scout
          path: |
            .bench/i27/source-input/materialization-manifest.json
            .bench/i27/source-run/canonical-artifacts.json
            .bench/i27/source-run/run.json
            .bench/i27/inverse/
            .bench/i27/staging-benchmark.json
          retention-days: 14
