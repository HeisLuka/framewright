name: Lab C20 Cover Adaptive Art Direction

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs'
      - '.agents/skills/framewright/scripts/make-c20-fixtures.mjs'
      - '.agents/skills/framewright/scripts/c20-palette-audit.mjs'
      - '.agents/skills/framewright/scripts/c20-summarize.mjs'
      - '.agents/skills/framewright/scripts/c20-review-sheets.mjs'
      - '.github/workflows/lab-c20-cover-adaptive.yml'
  workflow_dispatch:

jobs:
  cover-adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned renderer dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs
          node --check .agents/skills/framewright/scripts/make-c20-fixtures.mjs
          node --check .agents/skills/framewright/scripts/c20-palette-audit.mjs
          node --check .agents/skills/framewright/scripts/c20-summarize.mjs
          node --check .agents/skills/framewright/scripts/c20-review-sheets.mjs
      - name: Prepare current semantic template and paired fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-c20.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-c20.html examples/book-ad-systems/index-e17-c20.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-c20.html examples/book-ad-systems/index-e17-e14-c20.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-c20.html examples/book-ad-systems/index-e18-c20.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-c20.html examples/book-ad-systems/index-c20.html
          node .agents/skills/framewright/scripts/make-c20-fixtures.mjs examples/book-ad-systems/generated-c20
      - name: Audit extracted palettes and accessibility gates
        env:
          HTML: examples/book-ad-systems/index-c20.html
          MANIFEST: examples/book-ad-systems/generated-c20/manifest.json
          PALETTE_REPORT: artifacts/c20/palette-audit.json
        run: node .agents/skills/framewright/scripts/c20-palette-audit.mjs
      - name: Render 36 strict generic vs adaptive pairs
        env:
          HTML: examples/book-ad-systems/index-c20.html
          MANIFEST: examples/book-ad-systems/generated-c20/manifest.json
          OUT_DIR: artifacts/c20/videos
          REPORT: artifacts/c20/batch.json
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
      - name: Enforce C20 cost and layout gates
        run: node .agents/skills/framewright/scripts/c20-summarize.mjs artifacts/c20/batch.json artifacts/c20/palette-audit.json artifacts/c20/summary.json
      - name: Build paired review sheets
        run: node .agents/skills/framewright/scripts/c20-review-sheets.mjs artifacts/c20/batch.json artifacts/c20/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c20-cover-adaptive
          path: artifacts/c20/
          retention-days: 14
