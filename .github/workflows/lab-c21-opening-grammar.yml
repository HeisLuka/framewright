name: Lab C21 Deterministic Opening Grammar

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs'
      - '.agents/skills/framewright/scripts/make-c21-opening-fixtures.mjs'
      - '.agents/skills/framewright/scripts/c21-opening-audit.mjs'
      - '.agents/skills/framewright/scripts/c21-summarize.mjs'
      - '.agents/skills/framewright/scripts/c21-review-sheets.mjs'
      - '.github/workflows/lab-c21-opening-grammar.yml'
  workflow_dispatch:

jobs:
  opening-grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned renderer dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs
          node --check .agents/skills/framewright/scripts/make-c21-opening-fixtures.mjs
          node --check .agents/skills/framewright/scripts/c21-opening-audit.mjs
          node --check .agents/skills/framewright/scripts/c21-summarize.mjs
          node --check .agents/skills/framewright/scripts/c21-review-sheets.mjs
      - name: Prepare current semantic stack and controlled fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-c21.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-c21.html examples/book-ad-systems/index-e17-c21.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-c21.html examples/book-ad-systems/index-e17-e14-c21.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-c21.html examples/book-ad-systems/index-e18-c21.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-c21.html examples/book-ad-systems/index-c20-c21.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-c21.html examples/book-ad-systems/index-c21.html
          node .agents/skills/framewright/scripts/make-c21-opening-fixtures.mjs examples/book-ad-systems/generated-c21
      - name: Audit raw opening divergence and exact convergence
        env:
          HTML: examples/book-ad-systems/index-c21.html
          MANIFEST: examples/book-ad-systems/generated-c21/manifest.json
          AUDIT_REPORT: artifacts/c21/opening-audit.json
        run: node .agents/skills/framewright/scripts/c21-opening-audit.mjs
      - name: Render 10 books x 4 opening grammars
        env:
          HTML: examples/book-ad-systems/index-c21.html
          MANIFEST: examples/book-ad-systems/generated-c21/manifest.json
          OUT_DIR: artifacts/c21/videos
          REPORT: artifacts/c21/batch.json
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
      - name: Enforce C21 cost and layout gates
        run: node .agents/skills/framewright/scripts/c21-summarize.mjs artifacts/c21/batch.json examples/book-ad-systems/generated-c21/manifest.json artifacts/c21/opening-audit.json artifacts/c21/summary.json
      - name: Build opening review sheets
        run: node .agents/skills/framewright/scripts/c21-review-sheets.mjs artifacts/c21/batch.json examples/book-ad-systems/generated-c21/manifest.json artifacts/c21/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c21-opening-grammar
          path: artifacts/c21/
          retention-days: 14
