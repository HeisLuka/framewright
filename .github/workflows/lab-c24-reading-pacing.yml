name: Lab C24 Reading Pacing

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs'
      - '.agents/skills/framewright/scripts/make-c24-pacing-fixtures.mjs'
      - '.agents/skills/framewright/scripts/c24-pacing-audit.mjs'
      - '.agents/skills/framewright/scripts/c24-summarize.mjs'
      - '.agents/skills/framewright/scripts/c24-review-sheets.mjs'
      - '.github/workflows/lab-c24-reading-pacing.yml'
  workflow_dispatch:

jobs:
  reading-pacing:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned renderer dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs
          node --check .agents/skills/framewright/scripts/make-c24-pacing-fixtures.mjs
          node --check .agents/skills/framewright/scripts/c24-pacing-audit.mjs
          node --check .agents/skills/framewright/scripts/c24-summarize.mjs
          node --check .agents/skills/framewright/scripts/c24-review-sheets.mjs
      - name: Prepare current creative stack and pacing fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-c24.html
          node .agents/skills/framewright/scripts/prepare-c22-motion-quality.mjs examples/book-ad-systems/index-e12-c24.html examples/book-ad-systems/index-e12-c24-v2.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-c24-v2.html examples/book-ad-systems/index-e17-c24.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-c24.html examples/book-ad-systems/index-e17-e14-c24.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-c24.html examples/book-ad-systems/index-e18-c24.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-c24.html examples/book-ad-systems/index-c20-c24.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-c24.html examples/book-ad-systems/index-c21-c24.html
          node .agents/skills/framewright/scripts/prepare-c23-cover-composition.mjs examples/book-ad-systems/index-c21-c24.html examples/book-ad-systems/index-c23-c24.html
          node .agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs examples/book-ad-systems/index-c23-c24.html examples/book-ad-systems/index-c24.html
          node .agents/skills/framewright/scripts/make-c24-pacing-fixtures.mjs examples/book-ad-systems/generated-c24
      - name: Audit fixed-duration adaptive pacing
        env:
          HTML: examples/book-ad-systems/index-c24.html
          MANIFEST: examples/book-ad-systems/generated-c24/manifest.json
          AUDIT_REPORT: artifacts/c24/pacing-audit.json
        run: node .agents/skills/framewright/scripts/c24-pacing-audit.mjs
      - name: Render 15 fixed vs adaptive pacing pairs
        env:
          HTML: examples/book-ad-systems/index-c24.html
          MANIFEST: examples/book-ad-systems/generated-c24/manifest.json
          OUT_DIR: artifacts/c24/videos
          REPORT: artifacts/c24/batch.json
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
      - name: Enforce pacing cost and layout gates
        run: node .agents/skills/framewright/scripts/c24-summarize.mjs artifacts/c24/batch.json artifacts/c24/pacing-audit.json artifacts/c24/summary.json
      - name: Build absolute-time pacing review sheets
        run: node .agents/skills/framewright/scripts/c24-review-sheets.mjs artifacts/c24/batch.json artifacts/c24/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c24-reading-pacing
          path: artifacts/c24/
          retention-days: 14
