name: Lab C25 Typography Axis

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs'
      - '.agents/skills/framewright/scripts/make-c25-typography-fixtures.mjs'
      - '.agents/skills/framewright/scripts/c25-typography-audit.mjs'
      - '.agents/skills/framewright/scripts/c25-summarize.mjs'
      - '.agents/skills/framewright/scripts/c25-review-sheets.mjs'
      - '.github/workflows/lab-c25-typography-axis.yml'
  workflow_dispatch:

jobs:
  typography-axis:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned renderer dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs
          node --check .agents/skills/framewright/scripts/make-c25-typography-fixtures.mjs
          node --check .agents/skills/framewright/scripts/c25-typography-audit.mjs
          node --check .agents/skills/framewright/scripts/c25-summarize.mjs
          node --check .agents/skills/framewright/scripts/c25-review-sheets.mjs
      - name: Prepare controlled semantic stack and typography fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-c25.html
          node .agents/skills/framewright/scripts/prepare-c22-motion-quality.mjs examples/book-ad-systems/index-e12-c25.html examples/book-ad-systems/index-c22-c25.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-c22-c25.html examples/book-ad-systems/index-e17-c25.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-c25.html examples/book-ad-systems/index-e17-e14-c25.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-c25.html examples/book-ad-systems/index-e18-c25.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-c25.html examples/book-ad-systems/index-c20-c25.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-c25.html examples/book-ad-systems/index-c21-c25.html
          node .agents/skills/framewright/scripts/prepare-c23-cover-composition.mjs examples/book-ad-systems/index-c21-c25.html examples/book-ad-systems/index-c23-c25.html
          node .agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs examples/book-ad-systems/index-c23-c25.html examples/book-ad-systems/index-c25.html
          node .agents/skills/framewright/scripts/make-c25-typography-fixtures.mjs examples/book-ad-systems/generated-c25
      - name: Audit isolation and visual divergence
        env:
          HTML: examples/book-ad-systems/index-c25.html
          MANIFEST: examples/book-ad-systems/generated-c25/manifest.json
          AUDIT_REPORT: artifacts/c25/typography-audit.json
        run: node .agents/skills/framewright/scripts/c25-typography-audit.mjs
      - name: Render 40 controlled typography videos
        env:
          HTML: examples/book-ad-systems/index-c25.html
          MANIFEST: examples/book-ad-systems/generated-c25/manifest.json
          OUT_DIR: artifacts/c25/videos
          REPORT: artifacts/c25/batch.json
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
      - name: Enforce cost and layout gates
        run: node .agents/skills/framewright/scripts/c25-summarize.mjs artifacts/c25/batch.json artifacts/c25/typography-audit.json artifacts/c25/summary.json
      - name: Build typography review sheets
        run: node .agents/skills/framewright/scripts/c25-review-sheets.mjs artifacts/c25/batch.json examples/book-ad-systems/generated-c25/manifest.json artifacts/c25/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c25-typography-axis
          path: artifacts/c25/
          retention-days: 14
