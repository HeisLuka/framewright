name: lab-c31-bounded-creative-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/context-pack-v1.schema.json'
      - 'contracts/creative-proposal-v1.schema.json'
      - 'contracts/creative-proposal-v1.mjs'
      - 'contracts/check-creative-proposal-v1.mjs'
      - 'contracts/examples/context-pack-v1.example.json'
      - 'contracts/examples/creative-proposal-v1.example.json'
      - 'docs/c31-bounded-creative-contract.md'
      - '.github/workflows/lab-c31-bounded-creative-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JSON contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('contracts/context-pack-v1.schema.json','utf8')); JSON.parse(require('fs').readFileSync('contracts/creative-proposal-v1.schema.json','utf8')); JSON.parse(require('fs').readFileSync('contracts/examples/context-pack-v1.example.json','utf8')); JSON.parse(require('fs').readFileSync('contracts/examples/creative-proposal-v1.example.json','utf8'));"
      - name: Run deterministic contract gate
        run: node contracts/check-creative-proposal-v1.mjs
