name: C32 Context Atom Provenance

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/c27-narrative-plan.mjs'
      - 'contracts/creative-proposal-v1.mjs'
      - 'contracts/compile-creative-proposal-v1.mjs'
      - 'contracts/check-creative-proposal-v1.mjs'
      - 'contracts/check-context-atom-provenance-v1.mjs'
      - 'contracts/examples/context-pack-v1.example.json'
      - 'contracts/examples/creative-proposal-v1.example.json'
      - '.github/workflows/lab-c32-context-atom-provenance.yml'
      - 'docs/c32-context-atom-provenance.md'
  workflow_dispatch:

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/c27-narrative-plan.mjs
          node --check contracts/creative-proposal-v1.mjs
          node --check contracts/compile-creative-proposal-v1.mjs
          node --check contracts/check-context-atom-provenance-v1.mjs
      - name: Preserve existing C32 validator gate
        run: node contracts/check-creative-proposal-v1.mjs
      - name: Verify honest context-atom provenance
        run: |
          mkdir -p artifacts/c32-context-provenance
          node contracts/check-context-atom-provenance-v1.mjs | tee artifacts/c32-context-provenance/report.json
      - name: Validate provenance receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/c32-context-provenance/report.json','utf8'));
          if(r.status!=='PASS') throw new Error('context provenance gate failed');
          if(r.selected_context_atoms!==r.context_sources||r.selected_context_atoms<1) throw new Error('context atom accounting mismatch');
          if(r.semantic_projection_equal!==true) throw new Error('render semantics changed');
          if(r.legacy_narrative_plan_id===r.canonical_narrative_plan_id) throw new Error('NarrativePlan identity did not capture provenance change');
          if(r.legacy_program_id===r.canonical_program_id) throw new Error('program identity did not capture provenance change');
          console.log(JSON.stringify(r,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c32-context-atom-provenance
          path: artifacts/c32-context-provenance/report.json
          retention-days: 14
