name: Lab C34 Exploration Holdout Selector

on:
  pull_request:
    branches:
      - lab/framewright-research
    paths:
      - '.agents/skills/framewright/scripts/c30-campaign-learning.mjs'
      - '.agents/skills/framewright/scripts/c30-campaign-learning-audit.mjs'
      - '.agents/skills/framewright/scripts/c34-exploration-holdout-selector.mjs'
      - '.agents/skills/framewright/scripts/c34-exploration-holdout-selector-audit.mjs'
      - 'docs/c34-exploration-holdout-selector.md'
      - '.github/workflows/lab-c34-exploration-holdout-selector.yml'
  workflow_dispatch:

jobs:
  selector-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Syntax check C30/C34
        run: |
          node --check .agents/skills/framewright/scripts/c30-campaign-learning.mjs
          node --check .agents/skills/framewright/scripts/c34-exploration-holdout-selector.mjs
          node --check .agents/skills/framewright/scripts/c34-exploration-holdout-selector-audit.mjs
      - name: Re-run canonical C30 prior contract
        run: node .agents/skills/framewright/scripts/c30-campaign-learning-audit.mjs artifacts/c30
      - name: Audit C34 selector mechanics
        run: node .agents/skills/framewright/scripts/c34-exploration-holdout-selector-audit.mjs artifacts/c34
      - name: Show C34 summary
        run: cat artifacts/c34/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c34-exploration-holdout-selector
          path: |
            artifacts/c30/
            artifacts/c34/
          retention-days: 14
