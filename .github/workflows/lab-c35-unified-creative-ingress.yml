name: Lab C35 Unified Creative Ingress

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - 'contracts/creative-ingress-v1.mjs'
      - 'contracts/creative-ingress-v1.schema.json'
      - 'contracts/check-creative-ingress-v1.mjs'
      - 'contracts/creative-proposal-v1.mjs'
      - 'contracts/compile-creative-proposal-v1.mjs'
      - 'contracts/external-creative-draft-v1.mjs'
      - 'contracts/check-creative-proposal-v1.mjs'
      - 'contracts/check-context-atom-provenance-v1.mjs'
      - 'contracts/check-external-creative-draft-v1.mjs'
      - 'contracts/examples/context-pack-v1.example.json'
      - 'contracts/examples/creative-ingress-trusted-atoms-v1.example.json'
      - 'contracts/examples/creative-ingress-external-copy-v1.example.json'
      - 'docs/c35-unified-creative-ingress.md'
      - '.github/workflows/lab-c35-unified-creative-ingress.yml'
  workflow_dispatch:

jobs:
  ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse schema and examples
        run: |
          node -e "for (const f of ['contracts/creative-ingress-v1.schema.json','contracts/examples/creative-ingress-trusted-atoms-v1.example.json','contracts/examples/creative-ingress-external-copy-v1.example.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
      - name: Syntax check
        run: |
          node --check contracts/creative-ingress-v1.mjs
          node --check contracts/check-creative-ingress-v1.mjs
      - name: Preserve C32 trusted-atom contract
        run: node contracts/check-creative-proposal-v1.mjs
      - name: Preserve C32 honest context provenance
        run: node contracts/check-context-atom-provenance-v1.mjs
      - name: Preserve C33 expressive-copy trust contract
        run: node contracts/check-external-creative-draft-v1.mjs
      - name: Run unified C35 ingress gate
        run: |
          mkdir -p artifacts/c35
          node contracts/check-creative-ingress-v1.mjs | tee artifacts/c35/report.json
      - name: Validate C35 receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/c35/report.json','utf8'));
          if(r.status!=='PASS'||r.schema!=='newboo-c35-creative-ingress-audit-v1') throw new Error('C35 receipt invalid');
          if(JSON.stringify(r.modes)!==JSON.stringify(['trusted_atoms','external_copy_review_required'])) throw new Error('C35 modes drifted');
          if(r.trusted.preview_render_allowed!==true||r.trusted.publication_trust_satisfied!==true) throw new Error('trusted-atoms gate drift');
          if(r.external.preview_without_approval!==true||r.external.publication_trust_without_approval!==false) throw new Error('external preview gate drift');
          if(r.external.publication_trust_with_server_approval!==true||r.external.stale_approval_rejected!==true) throw new Error('external approval gate drift');
          if(r.external.approval_changes_program_identity!==false||r.external.approval_changes_ingress_identity!==false||r.external.approval_changes_decision_identity!==true) throw new Error('approval identity boundary drift');
          for(const value of Object.values(r.server_authority||{})) if(value!==true) throw new Error('server-authority gate failed');
          console.log(JSON.stringify(r,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c35-unified-creative-ingress
          path: artifacts/c35/report.json
          retention-days: 14
