name: Lab E04 Transport Codec

on:
  push:
    branches:
      - lab/e04-transport-codec
  pull_request:
    branches:
      - lab/e02-book-ad-v0
  workflow_dispatch:

jobs:
  transport-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/transport-codec-matrix.mjs

      - name: Run transport codec matrix
        env:
          HTML: examples/book-ad-v0/index.html
          PAYLOAD: examples/book-ad-v0/payload.example.json
          WIDTH: '1080'
          SEED: '7'
          OUT_DIR: artifacts/e04
        run: |
          node .agents/skills/framewright/scripts/transport-codec-matrix.mjs
          cat artifacts/e04/matrix.md

      - name: Preserve mid-video samples
        run: |
          for mode in png jpeg95 jpeg85 webp90; do
            ffmpeg -hide_banner -loglevel error -y -ss 6 -i "artifacts/e04/${mode}.mp4" -frames:v 1 "artifacts/e04/sample-${mode}.png"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e04-transport-codec
          path: artifacts/e04/
          if-no-files-found: error
          retention-days: 14
