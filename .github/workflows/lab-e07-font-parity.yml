name: Lab E07 Font Parity

on:
  push:
    branches: [lab/e07-font-parity]
  pull_request:
    branches: [lab/e02-book-ad-v0]

jobs:
  font-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save @napi-rs/canvas
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Prepare exact-font template
        run: node .agents/skills/framewright/scripts/prepare-font-parity.mjs examples/book-ad-v0/index.html examples/book-ad-v0/index-e07.html
      - name: Chromium pinned-font baseline
        env:
          HTML: examples/book-ad-v0/index-e07.html
          PAYLOAD: examples/book-ad-v0/payload.example.json
        run: |
          rm -rf frames-e07 artifacts/e07
          mkdir -p artifacts/e07
          start=$(date +%s%N)
          node .agents/skills/framewright/scripts/render.mjs frames-e07 7 1080 1
          mid=$(date +%s%N)
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i frames-e07/f%05d.png -c:v libx264 -preset veryfast -crf 22 -maxrate 14M -bufsize 28M -pix_fmt yuv420p -movflags +faststart artifacts/e07/chromium.mp4
          end=$(date +%s%N)
          node -e "const fs=require('fs');fs.writeFileSync('artifacts/e07/chromium-times.json',JSON.stringify({renderMs:(${mid}-${start})/1e6,encodeMs:(${end}-${mid})/1e6,totalMs:(${end}-${start})/1e6,tempBytes:+require('child_process').execSync('du -sb frames-e07').toString().split('\\t')[0]},null,2))"
      - name: Node canvas pinned-font stream
        env:
          HTML: examples/book-ad-v0/index-e07.html
          PAYLOAD: examples/book-ad-v0/payload.example.json
          REPORT: artifacts/e07/node-canvas.json
          PRESET: veryfast
          CRF: 22
          NODE_OPTIONS: --import=./.agents/skills/framewright/scripts/register-e07-font.mjs
        run: node .agents/skills/framewright/scripts/node-canvas-stream.mjs artifacts/e07/node-canvas.mp4 7 1080
      - name: Compare decoded outputs
        run: |
          ffmpeg -hide_banner -i artifacts/e07/chromium.mp4 -i artifacts/e07/node-canvas.mp4 -lavfi "[0:v]setpts=PTS-STARTPTS[ref];[1:v]setpts=PTS-STARTPTS[test];[ref][test]ssim" -f null - 2> artifacts/e07/ssim.txt
          ffmpeg -hide_banner -i artifacts/e07/chromium.mp4 -i artifacts/e07/node-canvas.mp4 -lavfi "[0:v]setpts=PTS-STARTPTS[ref];[1:v]setpts=PTS-STARTPTS[test];[ref][test]psnr" -f null - 2> artifacts/e07/psnr.txt
          grep -E 'All:|average:' artifacts/e07/ssim.txt artifacts/e07/psnr.txt || true
      - name: Preserve representative frames
        run: |
          for t in 1 4 6 10; do
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i artifacts/e07/chromium.mp4 -frames:v 1 "artifacts/e07/chromium-${t}s.png"
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i artifacts/e07/node-canvas.mp4 -frames:v 1 "artifacts/e07/node-${t}s.png"
          done
      - name: Summary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('artifacts/e07/chromium-times.json','utf8'));
          const n=JSON.parse(fs.readFileSync('artifacts/e07/node-canvas.json','utf8'));
          const ssimText=fs.readFileSync('artifacts/e07/ssim.txt','utf8');
          const psnrText=fs.readFileSync('artifacts/e07/psnr.txt','utf8');
          const ssim=ssimText.match(/All:([0-9.]+)/)?.[1]||null;
          const psnr=psnrText.match(/average:([0-9.]+)/)?.[1]||null;
          const out={chromium:c,nodeCanvas:n,speedup:+(c.totalMs/n.totalMs).toFixed(3),quality:{ssim:ssim?+ssim:null,psnr:psnr?+psnr:null}};
          fs.writeFileSync('artifacts/e07/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
          rm -rf frames-e07 examples/book-ad-v0/index-e07.html
      - uses: actions/upload-artifact@v4
        with:
          name: e07-font-parity
          path: artifacts/e07/
          retention-days: 14
