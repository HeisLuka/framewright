name: Lab E09 Cost Soak

on:
  pull_request:
    branches:
      - lab/framewright-research
    paths:
      - 'Dockerfile.node-canvas-worker'
      - 'package.node-canvas-worker.json'
      - '.agents/skills/framewright/scripts/node-canvas-soak.mjs'
      - '.agents/skills/framewright/scripts/e09-write-summary.mjs'
      - '.agents/skills/framewright/scripts/node-canvas-batch.mjs'
      - '.agents/skills/framewright/scripts/make-e08-fixtures.mjs'
      - '.agents/skills/framewright/scripts/prepare-pinned-font-template.mjs'
      - '.github/workflows/lab-e09-cost-soak.yml'
      - 'examples/book-ad-v0/**'
      - 'LAB-E09-COST-SNAPSHOT.md'
  workflow_dispatch:

concurrency:
  group: e09-cost-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOAK_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && '100' || '10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/node-canvas-soak.mjs
          node --check .agents/skills/framewright/scripts/e09-write-summary.mjs

      - name: Build pinned browserless worker
        run: docker build -f Dockerfile.node-canvas-worker -t framewright-node-canvas:e09 .

      - name: Record image identity
        run: |
          mkdir -p artifacts/e09
          docker image inspect framewright-node-canvas:e09 --format '{{.Id}}' > artifacts/e09/image-id.txt
          docker run --rm framewright-node-canvas:e09 sh -lc 'node -e "console.log(require(\"./node_modules/@napi-rs/canvas/package.json\").version)"' > artifacts/e09/canvas-version.txt
          docker run --rm framewright-node-canvas:e09 ffmpeg -version | head -1 > artifacts/e09/ffmpeg-version.txt

      - name: Run regression smoke or manual full soak
        run: |
          docker run --rm \
            --cpus=4 \
            --memory=4g \
            -v "$PWD/artifacts:/app/artifacts" \
            framewright-node-canvas:e09 sh -lc "
              node .agents/skills/framewright/scripts/make-e08-fixtures.mjs examples/book-ad-v0/generated-e08 &&
              node .agents/skills/framewright/scripts/prepare-pinned-font-template.mjs examples/book-ad-v0/index.html examples/book-ad-v0/index-e08.html &&
              SOAK_VIDEOS=$SOAK_VIDEOS \
              HTML=examples/book-ad-v0/index-e08.html \
              MANIFEST=examples/book-ad-v0/generated-e08/manifest.json \
              REPORT=artifacts/e09/soak.json \
              WIDTH=1080 PRESET=veryfast CRF=22 \
              node .agents/skills/framewright/scripts/node-canvas-soak.mjs
            "

      - name: Validate soak
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/e09/soak.json','utf8'));
          const expected=+process.env.SOAK_VIDEOS;
          const mib=n=>n/1048576;
          if(r.canvasVersion!=='1.0.9') throw new Error(`unexpected canvas ${r.canvasVersion}`);
          if(r.count!==expected) throw new Error(`expected ${expected} videos, got ${r.count}`);
          if(r.layoutWarningGroups!==0) throw new Error(`layout warnings ${r.layoutWarningGroups}`);
          if(mib(r.peakCombinedRssBytes)>1536) throw new Error(`peak RSS ${mib(r.peakCombinedRssBytes).toFixed(1)} MiB`);
          if(mib(r.memory.quartileDeltaBytes)>512) throw new Error(`RSS quartile growth ${mib(r.memory.quartileDeltaBytes).toFixed(1)} MiB`);
          console.log({
            videos:r.count,
            videosPerHour:r.videosPerHour,
            p50s:r.perVideoMs.p50/1000,
            p95s:r.perVideoMs.p95/1000,
            peakCombinedRssMiB:mib(r.peakCombinedRssBytes),
            firstQuartileRssMiB:mib(r.memory.firstQuartileMedianBytes),
            lastQuartileRssMiB:mib(r.memory.lastQuartileMedianBytes),
            quartileDeltaMiB:mib(r.memory.quartileDeltaBytes),
            slopeKiBPerVideo:r.memory.linearSlopeBytesPerVideo/1024
          });
          NODE

      - name: Write summary
        if: always()
        run: node .agents/skills/framewright/scripts/e09-write-summary.mjs artifacts/e09/soak.json artifacts/e09/summary.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e09-cost-soak
          path: artifacts/e09/
          retention-days: 14
