name: Lab E11 Visual Systems

on:
  pull_request:
    branches:
      - lab/framewright-research
    paths:
      - 'examples/book-ad-systems/**'
      - '.agents/skills/framewright/scripts/make-e11-fixtures.mjs'
      - '.agents/skills/framewright/scripts/e11-summarize.mjs'
      - '.agents/skills/framewright/scripts/e11-contact-sheets.mjs'
      - '.github/workflows/lab-e11-visual-systems.yml'
  workflow_dispatch:

jobs:
  visual-systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/make-e11-fixtures.mjs
          node --check .agents/skills/framewright/scripts/e11-summarize.mjs
          node --check .agents/skills/framewright/scripts/e11-contact-sheets.mjs

      - name: Build pinned browserless worker
        run: docker build -f Dockerfile.node-canvas-worker -t framewright-node-canvas:e11 .

      - name: Render 3 systems x 10 books
        run: |
          mkdir -p artifacts/e11
          docker run --rm \
            --cpus=4 \
            --memory=4g \
            -v "$PWD/artifacts:/app/artifacts" \
            framewright-node-canvas:e11 sh -lc '
              node .agents/skills/framewright/scripts/make-e11-fixtures.mjs examples/book-ad-systems/generated-e11 &&
              HTML=examples/book-ad-systems/index.html \
              MANIFEST=examples/book-ad-systems/generated-e11/manifest.json \
              OUT_DIR=artifacts/e11/videos \
              REPORT=artifacts/e11/batch.json \
              WIDTH=1080 PRESET=veryfast CRF=22 \
              node .agents/skills/framewright/scripts/node-canvas-batch.mjs &&
              node .agents/skills/framewright/scripts/e11-summarize.mjs artifacts/e11/batch.json artifacts/e11/style-summary.json artifacts/e11/summary.md &&
              node .agents/skills/framewright/scripts/e11-contact-sheets.mjs artifacts/e11/batch.json artifacts/e11/review
            '

      - name: Validate product batch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/e11/style-summary.json','utf8'));
          if(r.totalVideos!==30) throw new Error(`expected 30 videos, got ${r.totalVideos}`);
          if(r.layoutWarningGroups!==0) throw new Error(`layout warnings: ${r.layoutWarningGroups}`);
          for(const name of ['swiss','newspaper','paper']){
            const x=r.styles[name];
            if(!x||x.count!==10) throw new Error(`${name}: expected 10 videos`);
            if(x.videosPerHour<300) throw new Error(`${name}: throughput regression ${x.videosPerHour}/h`);
          }
          for(const name of ['swiss','newspaper','paper']){
            const p=`artifacts/e11/review/sheet-${name}.png`;
            if(!fs.existsSync(p)||fs.statSync(p).size<10000) throw new Error(`missing review sheet ${p}`);
          }
          console.log(JSON.stringify(r.styles,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e11-visual-systems
          path: artifacts/e11/
          retention-days: 14
