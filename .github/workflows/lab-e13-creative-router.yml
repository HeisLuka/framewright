name: Lab E13 Creative Router

on:
  pull_request:
    branches:
      - lab/framewright-research
    paths:
      - '.agents/skills/framewright/scripts/make-e13-routed-fixtures.mjs'
      - '.agents/skills/framewright/scripts/e13-diversity.mjs'
      - '.agents/skills/framewright/scripts/prepare-e12-motion-template.mjs'
      - '.agents/skills/framewright/scripts/node-canvas-batch.mjs'
      - '.github/workflows/lab-e13-creative-router.yml'
      - 'examples/book-ad-systems/**'
      - 'examples/book-ad-v0/**'
  workflow_dispatch:

jobs:
  routed-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned worker dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/make-e13-routed-fixtures.mjs
          node --check .agents/skills/framewright/scripts/e13-diversity.mjs
      - name: Prepare active-motion template + routed fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e13.html
          node .agents/skills/framewright/scripts/make-e13-routed-fixtures.mjs examples/book-ad-systems/generated-e13
      - name: Render 30 ranked candidate videos
        env:
          HTML: examples/book-ad-systems/index-e13.html
          MANIFEST: examples/book-ad-systems/generated-e13/manifest.json
          OUT_DIR: artifacts/e13/videos
          REPORT: artifacts/e13/batch.json
          WIDTH: '1080'
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-batch.mjs
      - name: Measure cross-system visual diversity
        run: node .agents/skills/framewright/scripts/e13-diversity.mjs artifacts/e13/batch.json examples/book-ad-systems/generated-e13/manifest.json artifacts/e13/diversity.json
      - name: Validate routing experiment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('artifacts/e13/batch.json','utf8'));
          const d=JSON.parse(fs.readFileSync('artifacts/e13/diversity.json','utf8'));
          const routes=JSON.parse(fs.readFileSync('examples/book-ad-systems/generated-e13/route-report.json','utf8'));
          if(b.count!==30) throw new Error(`expected 30 videos, got ${b.count}`);
          if(b.layoutWarningGroups!==0) throw new Error(`layout warnings ${b.layoutWarningGroups}`);
          if(routes.books.length!==10) throw new Error(`expected 10 routes, got ${routes.books.length}`);
          for(const book of routes.books){
            const styles=new Set(book.ranked.map(x=>x.system));
            if(styles.size!==3) throw new Error(`route for ${book.bookId} is not three-system diverse`);
            if(book.ranked[0].score<=book.ranked[1].score) throw new Error(`primary route for ${book.bookId} is not decisive: ${book.ranked.map(x=>x.score)}`);
          }
          if(d.minAcrossBooks<0.03) throw new Error(`visual diversity floor too low: ${d.minAcrossBooks}`);
          console.log({videos:b.count,videosPerHour:b.videosPerHour,layoutWarnings:b.layoutWarningGroups,meanDiversity:d.meanAcrossBooks,minDiversity:d.minAcrossBooks});
          NODE
      - name: Copy route report
        run: cp examples/book-ad-systems/generated-e13/route-report.json artifacts/e13/route-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e13-creative-router
          path: artifacts/e13/
          retention-days: 14
