name: Lab E17 Responsive Layout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs'
      - '.agents/skills/framewright/scripts/make-e17-responsive-fixtures.mjs'
      - '.agents/skills/framewright/scripts/node-canvas-profile-batch.mjs'
      - '.agents/skills/framewright/scripts/e17-review-sheets.mjs'
      - '.github/workflows/lab-e17-responsive-layout.yml'
  workflow_dispatch:

jobs:
  responsive-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned worker dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install FFmpeg + pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: |
          node --check .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs
          node --check .agents/skills/framewright/scripts/make-e17-responsive-fixtures.mjs
          node --check .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
          node --check .agents/skills/framewright/scripts/e17-review-sheets.mjs
      - name: Prepare responsive template + fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-e17.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-e17.html examples/book-ad-systems/index-e17.html
          node .agents/skills/framewright/scripts/make-e17-responsive-fixtures.mjs examples/book-ad-systems/generated-e17
      - name: Render 3 systems x 3 delivery profiles
        env:
          HTML: examples/book-ad-systems/index-e17.html
          MANIFEST: examples/book-ad-systems/generated-e17/manifest.json
          OUT_DIR: artifacts/e17/videos
          REPORT: artifacts/e17/batch.json
          PRESET: veryfast
          CRF: '22'
        run: node .agents/skills/framewright/scripts/node-canvas-profile-batch.mjs
      - name: Validate responsive outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('artifacts/e17/batch.json','utf8'));
          if(b.count!==9) throw new Error(`expected 9 videos, got ${b.count}`);
          if(b.layoutWarningGroups!==0) throw new Error(`layout warnings ${b.layoutWarningGroups}`);
          const dims={vertical:[1080,1920],square:[1080,1080],landscape:[1920,1080]};
          for(const r of b.results){const d=dims[r.profile];if(!d||r.width!==d[0]||r.height!==d[1])throw new Error(`${r.id}: bad dimensions`);}
          for(const book of ['river-station','city-seven','long-title']){const xs=b.results.filter(x=>x.bookId===book);if(xs.length!==3||new Set(xs.map(x=>x.profile)).size!==3)throw new Error(`${book}: missing profile`);if(new Set(xs.map(x=>x.seed)).size!==1)throw new Error(`${book}: seed changed across delivery profiles`);if(new Set(xs.map(x=>x.style)).size!==1)throw new Error(`${book}: visual system changed across profiles`);}
          console.log({videos:b.count,layoutWarnings:b.layoutWarningGroups,videosPerHour:b.videosPerHour});
          NODE
      - name: Build manual profile review sheets
        run: node .agents/skills/framewright/scripts/e17-review-sheets.mjs artifacts/e17/batch.json artifacts/e17/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e17-responsive-layout
          path: artifacts/e17/
          retention-days: 14
