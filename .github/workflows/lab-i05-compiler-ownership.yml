name: Lab I05 Compiler Ownership Scout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/i05-compiler-ownership-scout.mjs'
      - '.agents/skills/framewright/scripts/i05-c27-c26-parity.mjs'
      - '.agents/skills/framewright/scripts/i05-c27-delivery-matrix.mjs'
      - 'examples/book-ad-systems/platform-ui-profiles.v1.json'
      - 'docs/i05-compiler-ownership-scout.md'
      - '.github/workflows/lab-i05-compiler-ownership.yml'
  workflow_dispatch:

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/i05-compiler-ownership-scout.mjs
      - name: Run ownership scout
        run: |
          node .agents/skills/framewright/scripts/i05-compiler-ownership-scout.mjs \
            examples/book-ad-systems/platform-ui-profiles.v1.json \
            artifacts/i05/compiler-ownership.json
      - name: Print compact result
        run: |
          node -e "const r=require('./artifacts/i05/compiler-ownership.json'); console.log(JSON.stringify({counts:r.counts,invariants:r.invariants},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i05-compiler-ownership
          path: artifacts/i05/
          retention-days: 14

  c27-c26-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      C27_EXPECTED_SHA: 853a3c30a6c31afd5ef6f84e2ae20eda76fcef07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install pinned renderer dependencies
        run: npm install --no-save @napi-rs/canvas@1.0.9
      - name: Install pinned fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Pin real C27 planner and adapter
        run: |
          git fetch origin pull/52/head --depth=100
          git cat-file -e "$C27_EXPECTED_SHA^{commit}"
          mkdir -p artifacts/i05/c27-source
          git show "$C27_EXPECTED_SHA":.agents/skills/framewright/scripts/c27-narrative-plan.mjs > artifacts/i05/c27-source/c27-narrative-plan.mjs
          git show "$C27_EXPECTED_SHA":.agents/skills/framewright/scripts/prepare-c27-narrative-template.mjs > artifacts/i05/c27-source/prepare-c27-narrative-template.mjs
          git show "$C27_EXPECTED_SHA":.agents/skills/framewright/scripts/make-c27-narrative-fixtures.mjs > artifacts/i05/c27-source/make-c27-narrative-fixtures.mjs
          printf '%s\n' "$C27_EXPECTED_SHA" > artifacts/i05/c27-source/commit.txt
          node --check artifacts/i05/c27-source/c27-narrative-plan.mjs
          node --check artifacts/i05/c27-source/prepare-c27-narrative-template.mjs
          node --check artifacts/i05/c27-source/make-c27-narrative-fixtures.mjs
          node --check .agents/skills/framewright/scripts/i05-c27-c26-parity.mjs
          node --check .agents/skills/framewright/scripts/i05-c27-delivery-matrix.mjs
      - name: Prepare current C26 baseline
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-i05.html
          node .agents/skills/framewright/scripts/prepare-c22-motion-quality.mjs examples/book-ad-systems/index-e12-i05.html examples/book-ad-systems/index-c22-i05.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-c22-i05.html examples/book-ad-systems/index-e17-i05.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-i05.html examples/book-ad-systems/index-e17-e14-i05.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-i05.html examples/book-ad-systems/index-e18-i05.html
          node .agents/skills/framewright/scripts/prepare-c20-cover-adaptive.mjs examples/book-ad-systems/index-e18-i05.html examples/book-ad-systems/index-c20-i05.html
          node .agents/skills/framewright/scripts/prepare-c21-hook-grammar.mjs examples/book-ad-systems/index-c20-i05.html examples/book-ad-systems/index-c21-i05.html
          node .agents/skills/framewright/scripts/prepare-c23-cover-composition.mjs examples/book-ad-systems/index-c21-i05.html examples/book-ad-systems/index-c23-i05.html
          node .agents/skills/framewright/scripts/prepare-c24-reading-pacing.mjs examples/book-ad-systems/index-c23-i05.html examples/book-ad-systems/index-c24-i05.html
          node .agents/skills/framewright/scripts/prepare-c25-typography-axis.mjs examples/book-ad-systems/index-c24-i05.html examples/book-ad-systems/index-c25-i05.html
          node .agents/skills/framewright/scripts/prepare-c26-platform-safe.mjs examples/book-ad-systems/index-c25-i05.html examples/book-ad-systems/index-c26-i05.html examples/book-ad-systems/platform-ui-profiles.v1.json
          node .agents/skills/framewright/scripts/make-c26-platform-safe-fixtures.mjs examples/book-ad-systems/generated-c26-i05
      - name: Apply pinned C27 NarrativePlan adapter
        run: node artifacts/i05/c27-source/prepare-c27-narrative-template.mjs examples/book-ad-systems/index-c26-i05.html examples/book-ad-systems/index-c27-i05.html
      - name: Translation validation against C26 semantic checkpoints
        env:
          C26_HTML: examples/book-ad-systems/index-c26-i05.html
          C27_HTML: examples/book-ad-systems/index-c27-i05.html
          MANIFEST: examples/book-ad-systems/generated-c26-i05/manifest.json
          C27_PLAN_MODULE: artifacts/i05/c27-source/c27-narrative-plan.mjs
          PARITY_REPORT: artifacts/i05/c27-c26-parity.json
          PARITY_WIDTH: '540'
        run: node .agents/skills/framewright/scripts/i05-c27-c26-parity.mjs
      - name: Generate pinned C27 verified narrative fixtures
        run: node artifacts/i05/c27-source/make-c27-narrative-fixtures.mjs /tmp/c27-fixtures
      - name: Cross visual systems and platform delivery profiles
        env:
          C27_HTML: examples/book-ad-systems/index-c27-i05.html
          C27_FIXTURES: /tmp/c27-fixtures
          DELIVERY_REPORT: artifacts/i05/c27-delivery-matrix.json
          MATRIX_WIDTH: '540'
        run: node .agents/skills/framewright/scripts/i05-c27-delivery-matrix.mjs
      - name: Print I05 translation results
        run: |
          node -e "const r=require('./artifacts/i05/c27-c26-parity.json'); console.log(JSON.stringify({scenes:r.scenes,checkpoints:r.checkpointCount,pixelExact:r.pixelExact,pixelExactRatio:r.pixelExactRatio,revealStartDriftFrames:r.revealStartDriftFrames,bookSettledPreserved:r.bookSettledPreserved,safeViolations:r.safeViolations,translationGatePassed:r.translationGatePassed,errors:r.errors.length},null,2))"
          node -e "const r=require('./artifacts/i05/c27-delivery-matrix.json'); console.log(JSON.stringify({sourcePlan:r.sourcePlan,scenes:r.scenes,coverage:r.coverage,sampledFrames:r.sampledFrames,totalEvents:r.totalEvents,safeViolations:r.safeViolations,passed:r.passed,errors:r.errors.length},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i05-c27-c26-translation
          path: artifacts/i05/
          retention-days: 14
