name: Lab I09 Blocked Publication Scheduler

on:
  pull_request:
    branches:
      - lab/framewright-research
    paths:
      - '.agents/skills/framewright/scripts/c30-campaign-learning.mjs'
      - '.agents/skills/framewright/scripts/c37-doe-identifiability.mjs'
      - '.agents/skills/framewright/scripts/c37-doe-identifiability-audit.mjs'
      - '.agents/skills/framewright/scripts/i09-blocked-publication-scheduler.mjs'
      - '.agents/skills/framewright/scripts/i09-blocked-publication-scheduler-audit.mjs'
      - 'docs/i09-blocked-publication-scheduler.md'
      - '.github/workflows/lab-i09-blocked-publication-scheduler.yml'
  workflow_dispatch:

jobs:
  blocked-publication-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Syntax check C37/I09
        run: |
          node --check .agents/skills/framewright/scripts/c37-doe-identifiability.mjs
          node --check .agents/skills/framewright/scripts/i09-blocked-publication-scheduler.mjs
          node --check .agents/skills/framewright/scripts/i09-blocked-publication-scheduler-audit.mjs
      - name: Re-run canonical C37 design contract
        run: node .agents/skills/framewright/scripts/c37-doe-identifiability-audit.mjs artifacts/c37
      - name: Audit I09 blocked publication assignment
        run: node .agents/skills/framewright/scripts/i09-blocked-publication-scheduler-audit.mjs artifacts/i09
      - name: Show I09 summary
        run: cat artifacts/i09/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i09-blocked-publication-scheduler
          path: |
            artifacts/c37/
            artifacts/i09/
          retention-days: 14
