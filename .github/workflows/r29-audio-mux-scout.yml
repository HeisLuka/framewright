name: R29 Audio Mux Scout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/r29-audio-mux-scout.mjs'
      - '.github/workflows/r29-audio-mux-scout.yml'
      - 'docs/r29-audio-mux-scout.md'
  workflow_dispatch:

jobs:
  audio-mux-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/r29-audio-mux-scout.mjs

      - name: Build realistic mux fixtures outside timed loop
        run: |
          mkdir -p artifacts/r29
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=1080x1920:rate=30:duration=12' \
            -c:v libx264 -preset ultrafast -b:v 1200k -maxrate 1200k -bufsize 2400k \
            -g 60 -pix_fmt yuv420p -an -f h264 artifacts/r29/video.h264
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=110:sample_rate=48000:duration=12' \
            -filter:a 'volume=0.06' -c:a pcm_s16le artifacts/r29/track.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i artifacts/r29/track.wav -c:a aac -b:a 192k -movflags +faststart artifacts/r29/track.m4a
          ls -lh artifacts/r29/video.h264 artifacts/r29/track.wav artifacts/r29/track.m4a

      - name: Run A/B/C mux boundary benchmark
        env:
          OUT_DIR: artifacts/r29
          H264: artifacts/r29/video.h264
          WAV: artifacts/r29/track.wav
          AAC: artifacts/r29/track.m4a
          REPORT: artifacts/r29/report.json
          SUMMARY: artifacts/r29/summary.md
          REPEATS: '25'
          FPS: '30'
          BASELINE_FULL_MS: '4136.563'
          BASELINE_MUX_MS: '666.9'
        run: node .agents/skills/framewright/scripts/r29-audio-mux-scout.mjs

      - name: Show result
        if: always()
        run: |
          test -f artifacts/r29/summary.md && cat artifacts/r29/summary.md || true
          test -f artifacts/r29/report.json && node -e "const r=require('./artifacts/r29/report.json'); console.log(JSON.stringify(r.decision,null,2));" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-audio-mux-scout
          path: artifacts/r29/
          retention-days: 14
