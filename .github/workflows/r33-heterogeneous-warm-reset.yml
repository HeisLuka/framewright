name: R33 Heterogeneous Warm Reset

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/r33-heterogeneous-warm-reset.mjs'
      - '.github/workflows/r33-heterogeneous-warm-reset.yml'
      - 'docs/r33-heterogeneous-warm-reset.md'
  workflow_dispatch:

jobs:
  heterogeneous-warm-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: |
          npm install
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/r33-heterogeneous-warm-reset.mjs
      - name: Prepare exact C18 heterogeneous fixtures
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-r33.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-r33.html examples/book-ad-systems/index-e17-for-r33.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-r33.html examples/book-ad-systems/index-e17-e14-for-r33.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-r33.html examples/book-ad-systems/index-e18-for-r33.html
          node .agents/skills/framewright/scripts/make-e18-responsive-variant-fixtures.mjs examples/book-ad-systems/generated-r33
      - name: Build canonical AAC fixture once
        run: |
          mkdir -p artifacts/r33
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=110:sample_rate=48000:duration=12' \
            -filter:a 'volume=0.06' -t 12 -c:a aac -b:a 192k \
            -movflags +faststart artifacts/r33/track.m4a
      - name: Compare heterogeneous fresh pages vs warm page-object navigation
        env:
          HTML: examples/book-ad-systems/index-e18-for-r33.html
          MANIFEST: examples/book-ad-systems/generated-r33/manifest.json
          OUT_DIR: artifacts/r33
          AUDIO: artifacts/r33/track.m4a
          REPORT: artifacts/r33/report.json
          JOBS: '18'
          BITRATE: '2000000'
        run: node .agents/skills/framewright/scripts/r33-heterogeneous-warm-reset.mjs
      - name: Validate correctness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/r33/report.json','utf8'));
          if(!r.decision.correctnessPass) throw new Error('heterogeneous visual/state parity failed');
          if(r.results.fresh.jobs < 1 || r.results.navigateReuse.jobs < 1) throw new Error('no successful jobs');
          console.log(JSON.stringify(r.decision,null,2));
          NODE
      - name: Show result
        if: always()
        run: |
          test -f artifacts/r33/summary.md && cat artifacts/r33/summary.md || true
          test -f artifacts/r33/report.json && node -e "const r=require('./artifacts/r33/report.json'); console.log(JSON.stringify(r.decision,null,2));" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r33-heterogeneous-warm-reset
          path: |
            artifacts/r33/report.json
            artifacts/r33/summary.md
            artifacts/r33/track.m4a
          retention-days: 14
