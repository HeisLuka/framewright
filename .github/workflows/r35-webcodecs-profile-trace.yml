name: R35 WebCodecs Profile Content Hint Trace

on:
  push:
    branches: [lab/r35-webcodecs-profile-trace]
    paths:
      - '.agents/skills/framewright/scripts/r35-webcodecs-profile-trace.mjs'
      - '.github/workflows/r35-webcodecs-profile-trace.yml'
      - 'docs/r35-webcodecs-profile-trace.md'
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/r35-webcodecs-profile-trace.mjs'
      - '.github/workflows/r35-webcodecs-profile-trace.yml'
      - 'docs/r35-webcodecs-profile-trace.md'
  workflow_dispatch:

jobs:
  profile-content-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: |
          npm install
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/r35-webcodecs-profile-trace.mjs
      - name: Prepare exact C18 fixture
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-r35.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-r35.html examples/book-ad-systems/index-e17-for-r35.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-r35.html examples/book-ad-systems/index-e17-e14-for-r35.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-r35.html examples/book-ad-systems/index-e18-for-r35.html
          node .agents/skills/framewright/scripts/make-e18-responsive-variant-fixtures.mjs examples/book-ad-systems/generated-r35
      - name: Run profile content-hint and trace scout
        env:
          HTML: examples/book-ad-systems/index-e18-for-r35.html
          MANIFEST: examples/book-ad-systems/generated-r35/manifest.json
          OUT_DIR: artifacts/r35
          REPORT: artifacts/r35/report.json
        run: node .agents/skills/framewright/scripts/r35-webcodecs-profile-trace.mjs
      - name: Validate report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/r35/report.json','utf8'));
          if(r.schema!=='framewright-r35-webcodecs-profile-trace-v1') throw new Error('wrong schema');
          if(!Array.isArray(r.support)||r.support.length<12) throw new Error('missing support matrix');
          if(!Array.isArray(r.rows)||r.rows.length<3) throw new Error('missing codec rows');
          const x=r.rows.find(x=>x.id==='x264-high-crf22');
          if(!x) throw new Error('missing x264 High reference');
          if(!/High/i.test(String(x.probe?.profile||''))) throw new Error(`x264 reference is not High: ${x.probe?.profile}`);
          const b=r.rows.find(x=>x.id==='baseline-default-realtime-3m');
          if(!b) throw new Error('missing R31 Baseline anchor');
          for(const row of r.rows) for(const [name,m] of Object.entries(row.metrics||{})) {
            if(!Number.isFinite(m.ssim)||!Number.isFinite(m.psnr)) throw new Error(`${row.id}/${name}: invalid metric`);
          }
          if(!r.trace?.summary) throw new Error('missing trace summary');
          console.log(JSON.stringify(r.decision,null,2));
          console.log(JSON.stringify({browser:r.trace.browserVersion,gpu:r.trace.systemInfo?.gpu,trace:r.trace.summary},null,2));
          NODE
      - name: Show result
        if: always()
        run: test -f artifacts/r35/summary.md && cat artifacts/r35/summary.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r35-webcodecs-profile-trace
          path: |
            artifacts/r35/report.json
            artifacts/r35/summary.md
            artifacts/r35/trace-summary.json
            artifacts/r35/*.mp4
          retention-days: 14
