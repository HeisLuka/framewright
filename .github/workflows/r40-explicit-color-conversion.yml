name: R40 Explicit Color Conversion Scout

on:
  pull_request:
    paths:
      - '.agents/skills/framewright/scripts/r40-explicit-color-conversion.mjs'
      - '.github/workflows/r40-explicit-color-conversion.yml'
      - 'docs/r40-explicit-color-conversion.md'
  workflow_dispatch:

jobs:
  explicit-color-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install dependencies
        run: |
          npm install
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/r40-explicit-color-conversion.mjs
      - name: Run explicit conversion probe
        env:
          OUT_DIR: artifacts/r40
          REPORT: artifacts/r40/report.json
        run: node .agents/skills/framewright/scripts/r40-explicit-color-conversion.mjs
      - name: Validate report completeness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/r40/report.json','utf8'));
          if(r.schema!=='nightwill-r40-explicit-color-conversion-v1') throw new Error('wrong schema');
          if(!r.rows?.['canvas-default']?.supported) throw new Error('default canvas path missing');
          for(const id of ['canvas-bt709-tv','raw-i420-bt709-tv']) if(!r.rows?.[id]) throw new Error(`missing ${id}`);
          if(typeof r.decision?.canvasOverrideSupported!=='boolean') throw new Error('missing decision');
          console.log(JSON.stringify(r.decision,null,2));
          NODE
      - name: Show result
        run: cat artifacts/r40/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: r40-explicit-color-conversion
          path: |
            artifacts/r40/report.json
            artifacts/r40/summary.md
            artifacts/r40/*.mp4
          retention-days: 14
