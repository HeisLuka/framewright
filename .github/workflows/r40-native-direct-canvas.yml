name: R40 Native Direct Canvas Scout

on:
  pull_request:
    branches: [lab/framewright-research]
    paths:
      - '.agents/skills/framewright/scripts/r40-native-direct-canvas.mjs'
      - '.github/workflows/r40-native-direct-canvas.yml'
      - 'docs/r40-native-direct-canvas.md'
  workflow_dispatch:

jobs:
  native-direct-canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @napi-rs/canvas @napi-rs/webcodecs
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Syntax check
        run: node --check .agents/skills/framewright/scripts/r40-native-direct-canvas.mjs
      - name: Prepare exact C18 fixture
        run: |
          node .agents/skills/framewright/scripts/prepare-e12-motion-template.mjs examples/book-ad-systems/index.html examples/book-ad-systems/index-e12-for-r40.html
          node .agents/skills/framewright/scripts/prepare-e17-responsive-template.mjs examples/book-ad-systems/index-e12-for-r40.html examples/book-ad-systems/index-e17-for-r40.html
          node .agents/skills/framewright/scripts/prepare-e14-variant-template.mjs examples/book-ad-systems/index-e17-for-r40.html examples/book-ad-systems/index-e17-e14-for-r40.html
          node .agents/skills/framewright/scripts/prepare-e18-responsive-variants.mjs examples/book-ad-systems/index-e17-e14-for-r40.html examples/book-ad-systems/index-e18-for-r40.html
          node .agents/skills/framewright/scripts/make-e18-responsive-variant-fixtures.mjs examples/book-ad-systems/generated-r40
      - name: Run direct-canvas capacity matrix
        env:
          HTML: examples/book-ad-systems/index-e18-for-r40.html
          MANIFEST: examples/book-ad-systems/generated-r40/manifest.json
          OUT_DIR: artifacts/r40
          REPORT: artifacts/r40/report.json
          JOBS: 8
          BITRATE: 3000000
          CONCURRENCY: 1,2,3,4
        run: node .agents/skills/framewright/scripts/r40-native-direct-canvas.mjs
      - name: Validate report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/r40/report.json','utf8'));
          if(r.schema!=='framewright-r40-native-direct-canvas-v1') throw new Error('wrong schema');
          if(r.results.length!==12) throw new Error(`expected 12 scenarios, got ${r.results.length}`);
          const expected=new Set(['chromium','native-copy','native-direct']);
          for(const x of r.results){
            if(!expected.has(x.backend)) throw new Error(`unexpected backend ${x.backend}`);
            if(x.jobs<1||x.failures.length) throw new Error(`${x.backend} c${x.concurrency} failed`);
            if(!(x.meanEncodedBytes>100000)) throw new Error(`${x.backend} c${x.concurrency} implausible output bytes`);
            if(!(x.meanFrameBuildMs>=0)) throw new Error(`${x.backend} c${x.concurrency} missing frame-build metric`);
          }
          if(typeof r.decision?.directEarnsDeepPass!=='boolean') throw new Error('missing decision');
          console.log(JSON.stringify(r.decision,null,2));
          NODE
      - name: Show result
        if: always()
        run: test -f artifacts/r40/summary.md && cat artifacts/r40/summary.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r40-native-direct-canvas
          path: |
            artifacts/r40/report.json
            artifacts/r40/summary.md
          retention-days: 14
