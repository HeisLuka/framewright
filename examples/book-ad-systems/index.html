function cleanString(v,fallback,max){v=typeof v==='string'?v.trim():'';return(v||fallback).slice(0,max);}

function hash(){let h=2166136261>>>0;for(const a of arguments){const s=String(a)+'|';for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}}h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return h>>>0;}

const POOL={};

function font(g,size,weight=700){g.font=`${weight} ${size}px "DejaVu Sans", sans-serif`;g.textBaseline='alphabetic';}
function fitSingleSize(g,text,maxW,start=92,min=18,weight=700){for(let s=start;s>=min;s-=2){font(g,s,weight);if(g.measureText(text).width<=maxW)return s;}return min;}
function wrapAll(g,text,maxW){const words=String(text).split(/\s+/).filter(Boolean),lines=[];let line='';for(const word of words){const trial=line?line+' '+word:word;if(!line||g.measureText(trial).width<=maxW)line=trial;else{lines.push(line);line=word;}}if(line)lines.push(line);return lines.length?lines:[''];}
function ellipsizeLine(g,text,maxW){let s=text;while(s.length>1&&g.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s.trimEnd()+'…';}
function fitBlock(g,text,o={}){const maxW=o.maxW||900,maxH=o.maxH||Infinity,maxLines=o.maxLines||99,start=o.size||88,min=o.min||24,weight=o.weight||700,lineHeight=o.lineHeight||1.02;let size=start,lines=[],overflow=false;for(;size>=min;size-=2){font(g,size,weight);lines=wrapAll(g,text,maxW);const lh=size*lineHeight,widest=Math.max(0,...lines.map(line=>g.measureText(line).width));if(lines.length<=maxLines&&lines.length*lh<=maxH&&widest<=maxW+.5){overflow=false;break;}overflow=true;}if(size<min)size=min;font(g,size,weight);lines=wrapAll(g,text,maxW);const lh=size*lineHeight,byHeight=Math.max(1,Math.floor(maxH/lh)),allowed=Math.max(1,Math.min(maxLines,byHeight));if(lines.length>allowed){lines=lines.slice(0,allowed);lines[allowed-1]=ellipsizeLine(g,lines[allowed-1],maxW);overflow=true;}for(let i=0;i<lines.length;i++){if(g.measureText(lines[i]).width>maxW+.5){lines[i]=ellipsizeLine(g,lines[i],maxW);overflow=true;}}return{size,lines,lh,height:lines.length*lh,overflow};}
function textBlock(g,text,o={}){const b=fitBlock(g,text,o);font(g,b.size,o.weight||700);g.fillStyle=o.color||P.ink;g.textAlign=o.align||'left';let y=o.y||0,x=o.x||0;if(o.centerBlock)y-=((b.lines.length-1)*b.lh)/2;for(const line of b.lines){g.fillText(line,x,y);y+=b.lh;}return b;}
function label(g,text,x,y,o={}){const size=o.maxW?fitSingleSize(g,text,o.maxW,o.size||28,o.min||16,o.weight||700):(o.size||28);font(g,size,o.weight||700);g.fillStyle=o.color||P.ink;g.textAlign=o.align||'left';g.fillText(text,x,y);return size;}

function paperTitle(g,text,x,y,maxW,o={}){g.save();const a=o.alpha??1;g.globalAlpha=a*.22;textBlock(g,text,{x:x+5,y:y+4,maxW,maxH:o.maxH||380,size:o.size||82,min:o.min||28,maxLines:o.maxLines||6,lineHeight:o.lineHeight||.96,weight:800,color:P.accent});g.globalAlpha=a;textBlock(g,text,{x,y,maxW,maxH:o.maxH||380,size:o.size||82,min:o.min||28,maxLines:o.maxLines||6,lineHeight:o.lineHeight||.96,weight:800,color:P.ink});g.restore();}

function paperBook(g,S){paperBg(g,S.seed,'book');const e=easeOut(span(S.i,0,24));g.save();g.globalAlpha=.18;g.fillStyle=P.accent;g.beginPath();g.arc(SAFE.x+310,SAFE.y+455,295,0,Math.PI*2);g.fill();g.restore();drawCover(g,SAFE.x+lerp(-450,55,e),SAFE.y+190,395,592,{r:-.065,alpha:e,shadowColor:P.accent,offset:10});tape(g,SAFE.x+55,SAFE.y+145,170,48,-.09,mixHex(P.background,'#ffffff',.55),.9);const tx=SAFE.x+510,tw=SAFE.w-510;g.globalAlpha=easeOut(span(S.i,15,42));label(g,P.eyebrow,tx,SAFE.y+195,{size:21,min:14,maxW:tw,weight:800,color:P.accent});paperTitle(g,P.title,tx,SAFE.y+310,tw,{size:66,min:23,maxLines:8,maxH:370,lineHeight:.93});const tb=fitBlock(g,P.title,{maxW:tw,maxH:370,size:66,min:23,maxLines:8,lineHeight:.93,weight:800});label(g,P.author,tx,SAFE.y+350+tb.height,{size:25,min:16,maxW:tw,weight:600});g.globalAlpha=1;tape(g,SAFE.x+420,SAFE.y+820,SAFE.w-390,7,-.012,P.ink,1);textBlock(g,P.hook,{x:SAFE.x+430,y:SAFE.y+900,maxW:SAFE.w-430,maxH:240,size:31,min:19,maxLines:8,lineHeight:1.12,weight:500});pageNum(g,2);}

const SYSTEM={swiss:[swissHook,swissBook,swissCta],newspaper:[newspaperHook,newspaperBook,newspaperCta],paper:[paperHook,paperBook,paperCta]};
const PLATES=[];function plate(name,len,fn){PLATES.push({name,len,fn});}function total(){return PLATES.reduce((a,p)=>a+p.len,0);}function locate(n){let acc=0;for(let i=0;i<PLATES.length;i++){const p=PLATES[i];if(n<acc+p.len)return{p,index:i,local:n-acc,start:acc};acc+=p.len;}const p=PLATES.at(-1);return{p,index:PLATES.length-1,local:p.len-1,start:acc-p.len};}
plate('hook',90,(g,S)=>SYSTEM[P.visual_system][0](g,S));plate('book',150,(g,S)=>SYSTEM[P.visual_system][1](g,S));plate('cta',120,(g,S)=>SYSTEM[P.visual_system][2](g,S));
function post(src,dst){const dg=dst.getContext('2d');if(dst.width!==src.width||dst.height!==src.height){dst.width=src.width;dst.height=src.height;}dg.setTransform(1,0,0,1,0,0);dg.clearRect(0,0,dst.width,dst.height);dg.drawImage(src,0,0);}
function renderFrame(n,width,seed,target){const W=Math.max(2,Math.round(width)),H=Math.round(W*16/9/2)*2,cv=cvs('content',W,H),g=cv.getContext('2d'),sc=W/LW;const L=locate(Math.max(0,Math.min(total()-1,n|0))),S={f:n|0,i:L.local,t:L.local/Math.max(1,L.p.len-1),seed,plate:L.p.name,g,sc};g.setTransform(sc,0,0,sc,0,0);g.imageSmoothingEnabled=true;L.p.fn(g,S);safeDebug(g);g.setTransform(1,0,0,1,0,0);post(cv,target);return S;}
function contactSheet(n,cellW,seed,target){const cols=4,rows=Math.ceil(n/cols),cellH=Math.round(cellW*16/9),lab=34,gap=10,SW=cols*(cellW+gap)+gap,SH=rows*(cellH+lab+gap)+gap;target.width=SW;target.height=SH;const g=target.getContext('2d');g.fillStyle='#202020';g.fillRect(0,0,SW,SH);const tmp=cvs('cell',cellW*2,Math.round(cellW*2*16/9));for(let i=0;i<n;i++){const f=Math.round(i*(total()-1)/Math.max(1,n-1)),S=renderFrame(f,cellW*2,seed,tmp),x=gap+(i%cols)*(cellW+gap),y=gap+Math.floor(i/cols)*(cellH+lab+gap);g.drawImage(tmp,x,y,cellW,cellH);g.fillStyle='#ddd';g.font='14px "DejaVu Sans",sans-serif';g.textBaseline='top';g.textAlign='left';g.fillText(`f=${f} ${S.plate} ${(f/FPS).toFixed(1)}s`,x+2,y+cellH+7);}}
const MAIN=document.getElementById('c');
async function boot(){COVER=await loadCover(P.cover_url);window.RISO={fps:FPS,get total(){return total();},get plates(){return PLATES.map(x=>({name:x.name,len:x.len}));},payload:P,frame(n,width,seed){renderFrame(n,width??WIDTH,seed??SEED,MAIN);return MAIN.toDataURL('image/png');},contact(n,cellW){contactSheet(n||12,cellW||270,SEED,MAIN);return MAIN.toDataURL('image/png');}};if(Q.has('grid'))contactSheet(+Q.get('grid')||12,+Q.get('cw')||270,SEED,MAIN);else if(Q.has('f'))renderFrame(+Q.get('f')||0,WIDTH,SEED,MAIN);else{let f=+(Q.get('from')||0),last=0;const tick=ts=>{if(ts-last>=1000/FPS){last=ts;renderFrame(f++%total(),Math.min(WIDTH,540),SEED,MAIN);}requestAnimationFrame(tick);};requestAnimationFrame(tick);}window.__ready=true;}
boot().catch(e=>{console.error(e);window.__bootError=String(e);window.__ready=true;});
