<!doctype html>
<meta charset="utf-8">
<title>C53 semantic object physical fixture</title>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const P=window.FRAMEWRIGHT_PAYLOAD;
if(!P||!P.program||!Array.isArray(P.program.ops))throw new Error('C53 program payload required');
const canvas=document.getElementById('c'),g=canvas.getContext('2d');
const FPS=12,TOTAL=12;
const strokeCircleParts=new Set(['orbit','highlight','phase_path','stamp_ring']);
function drawOp(o,k){
  const ink='#171717',accent='#315a7d';
  g.save();g.lineCap='round';g.lineJoin='round';
  if(o.primitive==='line'){
    g.strokeStyle=(o.semantic_part||'').includes('rain')?accent:ink;g.lineWidth=Math.max(1,o.width*k);
    g.beginPath();g.moveTo(o.x1*k,o.y1*k);g.lineTo(o.x2*k,o.y2*k);g.stroke();
  }else if(o.primitive==='circle'){
    const r=o.r*k,cx=o.cx*k,cy=o.cy*k,part=o.semantic_part||'';
    g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);
    if(strokeCircleParts.has(part)||part.includes('orbit')){g.strokeStyle=ink;g.lineWidth=Math.max(1,3*k);g.stroke();}
    else {g.fillStyle=part.includes('shade')?'#b8b8b8':part.includes('bloom')?accent:ink;g.fill();}
  }else if(o.primitive==='rect'||o.primitive==='bar'){
    g.fillStyle=(o.semantic_part||'').includes('progress')?accent:ink;g.fillRect(o.x*k,o.y*k,o.w*k,o.h*k);
  }
  g.restore();
}
function frame(n,width,seed){
  const W=Math.max(128,Math.round(width)),H=W;if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
  const k=W/1000;g.setTransform(1,0,0,1,0,0);g.fillStyle='#f6f3ea';g.fillRect(0,0,W,H);
  g.strokeStyle='#d2cec4';g.lineWidth=Math.max(1,k);g.strokeRect(20*k,20*k,960*k,960*k);
  for(const o of P.program.ops)drawOp(o,k);
  return true;
}
window.RISO={fps:FPS,total:TOTAL,frame};window.__ready=true;
})();
</script>
